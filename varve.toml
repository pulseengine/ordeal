# ordeal's toolchain pin (varve layer).
#
# Why: the PulseEngine tools ordeal's own workflow uses (rivet, wsc, witness,
# and wasmtime for verify_release.sh's component smokes) come from ONE pinned,
# signed, dated layer instead of version strings scattered across workflow
# files. Realm `covalent` composes `pulseengine` (rivet, wsc, witness) and
# `pulseengine-wasm` (wasmtime); `varve verify` checks each composed layer
# against its own realm's root. varve-realms.toml is varve main's file at
# d1e94bd5 (covalent first ships in the varve v0.48.0 asset; replace it then). The
# realm supplies registry + trust root (varve-realms.toml beside this file),
# so no environment variable is needed.
#
# Bumping: change `layer`, run `varve install`, and record the digest it
# verified — resolved by name, then recorded, never guessed (the jess#261
# lesson: a name alone is ambiguous across registry moves).
manifest-version = 1

[toolchain]
realm   = "covalent"
channel = "rolling"
layer   = "2026.11.23"
# The digest `varve install` verified against the covalent root on 2026-11-22.
digest  = "sha256:925ab18e1ce2701beb34e622c18080b94eaae9c16e55c330a8476fcdea90d93e"
