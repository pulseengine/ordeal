[package]
name = "ordeal"
description = "Ordeal — a specialized, certificate-checked QF_BV SMT solver for the PulseEngine toolchain."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
# libtest's bench harness rejects criterion CLI flags; benches live in benches/.
bench = false
name = "ordeal"
path = "src/lib.rs"

[[bin]]
name = "ordeal"
path = "src/main.rs"

[dependencies]
# The LRAT certificate checker — the sole trusted component (in-workspace,
# no external code; the default build stays free of third-party deps and
# wasip2-clean). The solver depends on the checker to validate certificates;
# the checker never depends on the solver (the trust boundary, enforced by
# ordeal-lrat's empty dependency table).
ordeal-lrat = { path = "../ordeal-lrat", version = "0.17.0" }

# `ordeal-cert/v1` bundle serialization (issue #91 / TR-025 ordeal half).
# Optional: the default build stays dependency-free; rivet (the consumer)
# enables `cert-bundle`.
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }

[features]
cert-bundle = ["dep:serde", "dep:serde_json", "dep:sha2"]
# The Z3 differential oracle. Off by default: the default build has ZERO
# external dependencies and always compiles. Enabling this feature pulls in
# the `z3` crate (native targets only) so dev/CI runs can cross-check every
# verdict against Z3. The oracle is NOT part of the trust story — soundness
# rests on the verified LRAT checker alone (see ARCHITECTURE.md).
oracle = ["dep:z3"]

# The optional CaDiCaL SAT accelerator (TR-004). Off by default and native-
# only: `cadical-sys` vendors CaDiCaL 2.1.3 (C++) in its crate tarball and
# builds it hermetically via cxx — no network, no system solver. NEVER
# load-bearing: the production pipeline stays on the in-tree pure-Rust CDCL
# core; this backend is an accelerator / benchmark yardstick held to the
# identical soundness contract (LRAT through the verified checker before any
# Unsat, model self-check before any Sat). See src/sat_cadical.rs.
cadical = ["dep:cadical-sys"]

# ── SAT backend story (decided) ──────────────────────────────────────────────
# ordeal's own in-tree pure-Rust CDCL core (`src/sat.rs`) is the PRIMARY
# engine on EVERY target — native and wasm alike. There is no backend split:
# the default build declares no dependencies at all, which is what keeps
# `cargo build --target wasm32-wasip2 --release` green with no toolchain
# beyond rustc.
#
# - CaDiCaL (C++ via FFI) exists behind the off-by-default `cadical` feature
#   as a cfg-gated native accelerator — never a default dependency, never on
#   the wasm path, never load-bearing (see src/sat_cadical.rs).
# - varisat is a design reference only; it is never a dependency.
# - Z3 lives below, behind the off-by-default `oracle` feature, as a
#   differential oracle / benchmark rival only — never the engine.

# Native-only: the wasm path must never see a C/FFI dependency, so the z3
# bindings are scoped to non-wasm targets. Enabling `oracle` on a wasm target
# is a no-op dependency-wise (and the oracle module compiles out there).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
z3 = { version = "0.20.2", optional = true }
# CaDiCaL for the off-by-default `cadical` accelerator feature (TR-004).
# Vendored C++ source, hermetic build; never on the wasm path.
cadical-sys = { version = "0.7.0", optional = true }

# `kani` is a cfg set only under `cargo kani` (the bit-blaster proof harnesses in
# src/blast/proofs.rs, and the no-op strash in src/aig.rs). Declare it so normal
# builds/clippy don't flag it as an unknown cfg.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

# Benchmarks only (dev-dependency: the default build stays dependency-free
# for downstream consumers — dev-deps never propagate).
[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "latency"
harness = false

[[bench]]
name = "bmc"
harness = false
