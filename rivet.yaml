project:
  name: ordeal
  version: "0.1.0"
  description: >
    Certificate-checked QF_BV SMT solver for the PulseEngine toolchain.
    Replaces the Z3 static-link build burden for loom (verified WASM
    optimizer) and synth (verified WASM-to-ARM codegen) with an untrusted
    solver paired with a formally-verified LRAT certificate checker. Only
    the checker is trusted; Z3 is demoted to a differential oracle and
    benchmark rival. See loom issue #246 for the grounding requirements.

  schemas:
    - common
    - aspice
    # Per-level ASPICE V-closure at severity error (TR-047) — schemas/ordeal-v-closure.yaml
    - ordeal-v-closure

# Release readiness (TR-047). `require: coverage` also derives readiness from
# the V-closure rules; the TEETH are the error-severity rules in
# schemas/ordeal-v-closure.yaml, which make `rivet validate` fail on any open
# chain — and the release job runs validate + `rivet release status <tag>`
# before it publishes anything.
release:
  require: coverage

sources:
  - path: artifacts
    format: generic-yaml

docs:
  - docs

commits:
  format: trailers
  trailers:
    Implements: satisfies
    Fixes: fixes
    Verifies: verifies
    Trace: traces-to
  skip-trailer: "Trace: skip"
  exempt-types:
    - chore
    - style
    - ci
    - docs
    - build
  # Commits touching these paths must carry artifact trailers (or
  # `Trace: skip`). scripts/ hosts CI gates and lean/ the proofs — both are
  # load-bearing code, not glue. (Note: this key governs commit-trailer
  # exemption only; source-marker scanning is repo-wide.)
  traced-paths:
    - crates/
    - scripts/
    - lean/

externals:
  loom:
    git: https://github.com/pulseengine/loom.git
    ref: main
    prefix: loom

  synth:
    git: https://github.com/pulseengine/synth.git
    ref: main
    prefix: synth

  gale:
    git: https://github.com/pulseengine/gale.git
    ref: main
    prefix: gale

  kiln:
    git: https://github.com/pulseengine/kiln.git
    ref: main
    prefix: kiln

  sigil:
    git: https://github.com/pulseengine/sigil.git
    ref: main
    prefix: sigil

  scry:
    git: https://github.com/pulseengine/scry.git
    ref: main
    prefix: scry

  jess:
    git: https://github.com/pulseengine/jess.git
    ref: main
    prefix: jess

  relay:
    git: https://github.com/pulseengine/relay.git
    ref: main
    prefix: relay

  witness:
    git: https://github.com/pulseengine/witness.git
    ref: main
    prefix: witness
