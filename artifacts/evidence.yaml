artifacts:

  - id: OC-001
    type: ordeal-certificate
    title: "Certified: width-12 rotate/shift identity (non-power-of-two, #182 class)"
    status: verified
    description: "Bundle evidence/certs/rotl_decompose_w12.json, emitted by crates/ordeal/examples/cert_bundle_smt2.rs from evidence/certs/rotl_decompose_w12.smt2 with ordeal 0.23.0. The example re-parsed it (content hashes verified) and re-ran the trusted ordeal-lrat checker (verification-result pass). Z3 independently reports the query unsat. The width is not a power of two, the class #182 mis-encoded."
    fields:
      attests-claim: rotate_left 1 equals its shift decomposition for every 12-bit x >> b, b < 12
      attests-kind: qf_bv_validity
      checked-by: {name: ordeal-lrat, version: 0.23.0}
      cnf-sha256: 93f5332ede7da2f9f8b55c0017594ea8a86ce03c605008f9cd907aa287afffa6
      format: ordeal-cert/v1
      # Mappings written by hand: `rivet add --field` cannot set type: mapping (rivet#1021).
      produced-by: {name: ordeal, version: 0.23.0}
      proof-sha256: 04124c8865b9b4e0e328ea378fe8e9d55ec28c2d8f46ab4d2cf21934de4cfc76
      recheck: {command: "cargo run -p ordeal --features cert-bundle --example cert_bundle_smt2 -- evidence/certs/rotl_decompose_w12.smt2 evidence/certs/rotl_decompose_w12.json qf_bv_validity 'rotate_left 1 equals its shift decomposition for every 12-bit x >> b, b < 12'", expect-exit: 0}
      cited-source:
        uri: ./evidence/certs/rotl_decompose_w12.json
