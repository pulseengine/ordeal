# SW Architecture Components (ASPICE SWE.2)
#
# System: Ordeal — certificate-checked QF_BV SMT solver
#
# The pipeline is: term graph -> bit-blaster/AIG -> CNF (Tseitin) -> SAT backend
# -> LRAT -> verified checker, with a Z3 oracle bolted on for differential
# cross-checking. The trust boundary encloses ONLY the verified checker.
#
# Format: rivet generic-yaml

artifacts:
  - id: ARC-001
    type: sw-arch-component
    title: ordeal-api (thin one-shot check-sat facade)
    description: >
      Public Rust facade exposing one-shot check-sat with counterexample
      models. Accepts QF_BV formulas (plus the array/UF sliver), enforces
      fragment scope, and returns SAT-with-model or UNSAT-with-certificate.
      This is the stable surface loom and synth embed in-process.
      UNTRUSTED — a bug here can at worst yield a wrong SAT model (caught by
      model re-evaluation) or a rejected certificate.
    status: implemented
    tags: [api, facade, untrusted]
    links:
      - type: allocated-from
        target: TR-002
      - type: allocated-from
        target: TR-010

  - id: ARC-002
    type: sw-arch-component
    title: ordeal-term (QF_BV term graph and preprocessing)
    description: "QF_BV term representation (crates/ordeal/src/term.rs): an owned expression tree (Box-linked BvTerm/BoolTerm enums — NOT hash-consed; sharing is recovered downstream by the AIG's structural hashing, and the canon pass orders commutative operands and folds constants, v0.8.0) over any width 1..=128, the closed operator set (loom #246), plus the array/UF sliver (crates/ordeal/src/sliver.rs): read-over-write reduction of Array(BV32->BV8) select/store over concrete AND symbolic BV32 indices (symbolic since v0.11.0, TR-028) and Ackermannization of uninterpreted pure_call congruence. Emits a pure QF_BV problem into the blaster. UNTRUSTED. (Description corrected 2026-09-24: it previously claimed a hash-consed graph, widths 8/32/64 only and concrete offsets only.)"
    status: implemented
    tags: [term-graph, preprocessing, array, uf, untrusted]
    links:
      - type: allocated-from
        target: TR-001
      - type: allocated-from
        target: TR-008

      - type: allocated-from
        target: TR-028
  - id: ARC-003
    type: sw-arch-component
    title: ordeal-aig (bit-blaster and And-Inverter Graph)
    description: "Bit-blaster (crates/ordeal/src/blast/) lowering each QF_BV operator to an And-Inverter Graph (crates/ordeal/src/aig.rs) with structural hashing and constant folding — no further local rewrites. UNTRUSTED — every blast rule is machine-checked in Lean 4 against BitVec semantics at unbounded width (lean/Blaster*.lean, required CI context; shifts at widths 2^stages), with Kani harnesses at width 8 as an independent second witness and the end-to-end certificate/oracle checks. (Description corrected 2026-09-24: it previously claimed a curated Bitwuzla-subset of rewrites and named Kani P4 as the closing evidence.)"
    status: implemented
    tags: [bit-blasting, aig, structural-hashing, rewrites, untrusted]
    links:
      - type: allocated-from
        target: TR-003
      - type: allocated-from
        target: TR-009

  - id: ARC-004
    type: sw-arch-component
    title: ordeal-cnf (Tseitin CNF encoder)
    description: >
      Tseitin transformation lowering the AIG to CNF, maintaining the mapping
      from bit-vector variables to CNF literals needed to reconstruct models and
      to thread the LRAT certificate back to the original query. UNTRUSTED.
    status: implemented
    tags: [cnf, tseitin, encoding, untrusted]
    links:
      - type: allocated-from
        target: TR-003

  - id: ARC-005
    type: sw-arch-component
    title: ordeal-sat (own pure-Rust CDCL core; optional CaDiCaL accelerator)
    description: >
      SAT solving layer built around ordeal's own in-tree pure-Rust CDCL core —
      the primary engine on every target, FFI-free, emitting LRAT in the exact
      format the verified checker consumes. CaDiCaL (C++ via FFI) is an
      optional, cfg-gated, native-only accelerator and benchmark yardstick,
      never load-bearing. Returns a satisfying assignment (mapped back to a
      model) or an UNSAT proof trace. UNTRUSTED — the SAT engine is never part
      of the soundness argument.
    status: implemented
    tags: [sat, cdcl, pure-rust, cadical, lrat, untrusted]
    links:
      - type: allocated-from
        target: TR-004
      - type: allocated-from
        target: TR-005

  - id: ARC-006
    type: sw-arch-component
    title: ordeal-lrat (verified certificate checker)
    description: "The sole TRUSTED component (crates/ordeal-lrat, zero dependencies): the LRAT checker kernel::check_steps — if it accepts a certificate for a CNF, that CNF is unsatisfiable (lean/Sound.lean lrat_check_sound) — and, since TR-038, the SAT-witness checker kernel::check_sat / check_binding (lean/SatWitness.lean check_sat_sound / check_binding_sound / verdicts_exclusive, TR-044). Both are machine-checked over the Aeneas model regenerated from this crate's source in CI (TR-034). It has no build or link dependency on the solver, so the trust boundary is exactly this crate. Ordeal reports UNSAT only when this checker accepts the certificate, and SAT-with-witness only when check_sat accepts. LRAT trimming is NOT here: it lives in the untrusted solver (crates/ordeal/src/lrat.rs), and an over-trimmed proof is simply rejected. (Description corrected 2026-09-24: it previously claimed the trusted crate includes LRAT trimming.)"
    status: implemented
    tags: [lrat, checker, verified, trusted-core, aeneas, lean]
    links:
      - type: allocated-from
        target: TR-006
      - type: allocated-from
        target: TR-005
      - type: allocated-from
        target: TR-009
      - type: allocated-from
        target: TR-013

      - type: allocated-from
        target: TR-038
      - type: allocated-from
        target: TR-044
      - type: allocated-from
        target: TR-034
  - id: ARC-007
    type: sw-arch-component
    title: ordeal-oracle (Z3 differential harness)
    description: >
      Development/CI-only harness that runs each query through both Ordeal and
      Z3 and compares verdicts and models. Also drives the benchmark comparison.
      Excluded from the production critical path and from the soundness
      argument; NOT trusted and NOT shipped in the embeddable build.
    status: implemented
    tags: [z3, oracle, differential, benchmark, dev-only]
    links:
      - type: allocated-from
        target: TR-007

  - id: ARC-008
    type: sw-arch-component
    title: ordeal-backend-split (own core everywhere / CaDiCaL native opt-in cfg gate)
    description: >
      The cfg-driven target split that keeps ordeal buildable as wasm32-wasip2.
      Ordeal's own pure-Rust CDCL core (an in-tree crate, no dep line) is the
      engine on every target; the optional native CaDiCaL accelerator (C++ via
      FFI) is compiled out on wasm and opt-in on native. The default
      (no-extras) build stays zero-external-dependency and wasip2-clean.
      Realized as target.'cfg(...)'.dependencies in Cargo.toml so no FFI/C
      dependency ever reaches the wasm path. UNTRUSTED — backend choice is
      below the trust boundary and never affects soundness.
    status: implemented
    tags: [wasm32-wasip2, cdcl, pure-rust, cadical, backend-split, cfg, untrusted]
    links:
      - type: allocated-from
        target: TR-011
      - type: allocated-from
        target: TR-004

  - id: ARC-009
    type: sw-arch-component
    title: ordeal-build-bazel (rules_rust + rules_wasm_component + reserved rules_lean)
    description: "The Bazel build definition (MODULE.bazel, BUILD.bazel, crates/*/BUILD.bazel) mirroring the synth org conventions: rules_rust with the crate set resolved from Cargo.lock via crate_universe from_cargo; native rust_library / rust_binary / rust_test targets (bazel test executes the unit tests, #136). rules_wasm_component is declared as a bazel_dep but deliberately NOT wired to a target (#136 disposition: the enforced wasm artifact is the cargo-built component, gated by the required native<->wasm differential; a second, unexercised Bazel wasm build would recreate the two-artifact drift). rules_lean remains a reserved placeholder — the Lean proofs build via lake + the nix-pinned Charon/Aeneas regen in CI, not Bazel. The optional 'Bazel build' CI job is non-required. (Description corrected 2026-09-24: it previously stated rules_wasm_component packages the component.)"
    status: implemented
    tags: [bazel, rules_rust, rules_wasm_component, rules_lean, build]
    links:
      - type: allocated-from
        target: TR-012
      - type: allocated-from
        target: TR-011
