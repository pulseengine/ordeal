  - id: ARC-008
    type: sw-arch-component
    title: ordeal-backend-split (own core everywhere / CaDiCaL native opt-in cfg gate)
    description: >
      The cfg-driven target split that keeps ordeal buildable as wasm32-wasip2.
      Ordeal's own pure-Rust CDCL core (an in-tree crate, no dep line) is the
      engine on every target; the optional native CaDiCaL accelerator (C++ via
      FFI) is compiled out on wasm and opt-in on native. The default
      (no-extras) build stays zero-external-dependency and wasip2-clean.
      Realized as target.'cfg(...)'.dependencies in Cargo.toml so no FFI/C
      dependency ever reaches the wasm path. UNTRUSTED — backend choice is
      below the trust boundary and never affects soundness.
    status: verified
    tags: [wasm32-wasip2, cdcl, pure-rust, cadical, backend-split, cfg, untrusted]
    links:
      - type: allocated-from
        target: TR-011
      - type: allocated-from
        target: TR-004

  - id: ARC-009
    type: sw-arch-component
    title: ordeal-build-bazel (rules_rust + rules_wasm_component + reserved rules_lean)
    description: "The Bazel build definition (MODULE.bazel, BUILD.bazel, crates/*/BUILD.bazel) mirroring the synth org conventions: rules_rust with the crate set resolved from Cargo.lock via crate_universe from_cargo; native rust_library / rust_binary / rust_test targets (bazel test executes the unit tests, #136). rules_wasm_component is declared as a bazel_dep but deliberately NOT wired to a target (#136 disposition: the enforced wasm artifact is the cargo-built component, gated by the required native<->wasm differential; a second, unexercised Bazel wasm build would recreate the two-artifact drift). rules_lean remains a reserved placeholder — the Lean proofs build via lake + the nix-pinned Charon/Aeneas regen in CI, not Bazel. The optional 'Bazel build' CI job is non-required. (Description corrected 2026-09-24: it previously stated rules_wasm_component packages the component.)"
    status: verified
