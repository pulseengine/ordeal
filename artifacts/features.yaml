  - id: FEAT-009
    type: sw-req
    title: "P8 — SMT-LIB2 QF_BV front-end / Verus bridge (v0.11.0)"
    description: >
      Ingest the QF_BV subset of SMT-LIB2 that Verus emits, decide it, and return
      a portable LRAT certificate. The gale unlock: its 52 by(bit_vector) ASIL-D
      obligations (fault_decode/mpu/cpu_mask) are discharged today by UNCHECKED
      Z3 inside a safety case that names "Verus SMT/Z3" as the evidence — this
      converts that into an independently re-checkable, Lean-checker-backed
      certificate. Also serves relay's ~30 Verus escape hatches and any Verus
      consumer.
    status: draft
    release: v0.11.0
    tags: [roadmap, p8, smtlib, verus, gale, relay, asil-d, certificate]
    links:
      - type: derives-from
        target: SYS-006
      - type: satisfies
        target: TR-023
    fields:
      req-type: functional
      priority: should
      verification-criteria: >
        On gale fault_decode/mpu and relay bitpack obligations, the reader yields
        UNSAT + a checker-accepted certificate; out-of-fragment input errors
        clearly.

