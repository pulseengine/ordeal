  - id: FEAT-013
    type: sw-req
    title: "P8 — symbolic-index linear-memory sliver (v0.11.0)"
    description: >
      Unblocks loom's verifier migration (issue #70), pulled ahead of the
      Verus-VC bridge because it blocks a real consumer today rather than a
      planned capability. loom models linear memory as one global
      Array(BV32 -> BV8) and does multi-byte load/store as little-endian chains
      over a SYMBOLIC BV32 base address (a local.get / computed stack value, not
      a constant). ordeal's sliver resolves CONCRETE indices only — a symbolic
      index returns NonConcreteIndex -> Unknown, so every loom function that
      touches memory reverts, and memory-heavy modules would get near-zero
      optimization the moment loom flips its backend to ordeal. This release
      makes select/store sound for a symbolic index, keeping the fixed
      BV32 -> BV8 sorts loom actually uses. Incremental-safe by construction:
      loom already maps Unknown to a conservative revert, so partial coverage
      raises optimization rather than risking soundness, and the encoding can
      land behind the existing concrete fast-path.
    status: verified
    release: v0.11.0
    tags: [roadmap, p8, array, symbolic-index, read-over-write, loom, sliver]
    links:
      - type: derives-from
        target: SYS-007
      - type: derives-from
        target: SYS-006
      - type: satisfies
        target: TR-028
    fields:
      req-type: functional
      priority: must
      verification-criteria: >
        loom's multi-byte little-endian load/store chains over a symbolic BV32
        base decide (not Unknown) and agree with the Z3 differential; every
        Unsat carries a recheck()-able certificate.
  - id: FEAT-014
    type: sw-req
    title: "P11a — propositional SAT front-end (certified feature-model consistency) (v0.14.0)"
    description: >
      Split from the certificate-as-evidence umbrella (2026-07-21, a logged
      scope decision): that umbrella spans three pieces across two repos, and
      only the propositional SAT front-end is ordeal-side and ready. This
      feature is that piece — `Solver::check_cnf` decides a caller-supplied CNF
      through the same certified solve/emit-LRAT/check path as the bit-blaster,
      so a feature-model or variant consistency verdict becomes an
      offline-re-checkable certificate rather than an internal solver's say-so.
      The cross-repo pieces (the rivet certificate artifact schema and the
      rules_ordeal hermetic Bazel rule) remain in the umbrella, moved to
      v0.17.0.
    status: verified
    release: v0.14.0
    tags: [roadmap, p11a, sat, cnf, certificate, feature-model, rivet]
    links:
      - type: derives-from
        target: SYS-002
      - type: satisfies
        target: TR-026
    fields:
      req-type: functional
      priority: should
      verification-criteria: >
        check_cnf returns a certified UNSAT (certificate over the submitted
        clauses, re-checkable) for an inconsistent clause set and a self-checked
        configuration for a consistent one; a feature-model mutual-exclusion
        conflict is certified UNSAT; the propositional path agrees with the
        bit-blaster on a shared query.
