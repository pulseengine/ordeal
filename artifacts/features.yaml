# Features / Roadmap (P0–P5)
#
# System: Ordeal — certificate-checked QF_BV SMT solver
#
# The delivery phases P0–P5 modeled as software requirements (roadmap
# deliverables). These artifacts are the SOURCE OF TRUTH for the phase
# breakdown; ROADMAP.md is a human-readable mirror slated to be generated
# from rivet. Each phase derives-from the system requirement it advances and
# satisfies the technical requirements it fulfills, giving a
# phase-to-requirement trace. See loom issue #246 for the grounding
# requirements.
#
# Format: rivet generic-yaml

artifacts:
  - id: FEAT-000
    type: sw-req
    title: "P0 — Skeleton: closed fragment, sound-by-construction interface"
    description: >
      Establish the closed QF_BV fragment (term.rs, the loom #246 op set) and a
      one-shot check interface that conservatively returns Unknown for every
      query — sound by construction because callers must never optimize on
      Unknown. Zero-dependency default build, wasm32-wasip2 buildability
      CI-gated, Bazel build mirroring org conventions. Deliverable: the crate
      compiles with and without the oracle feature and check is provably sound.
    status: verified
    release: v0.1.0
    tags: [roadmap, p0, skeleton, closed-fragment, wasip2]
    links:
      - type: derives-from
        target: SYS-007
      - type: derives-from
        target: SYS-005
      - type: satisfies
        target: TR-011
      - type: satisfies
        target: TR-012
    fields:
      req-type: functional
      priority: must
      verification-criteria: >
        Crate compiles with and without the oracle feature; check returns only
        Unknown (never authorizes a transformation); wasip2 build gate green.

  - id: FEAT-001
    type: sw-req
    title: "P1 — Bit-blaster + own pure-Rust CDCL SAT core + oracle wired"
    description: >
      Turn terms into a boolean problem and solve it (answer only, no
      certificate yet): bit-blasting rules for every fragment op at widths
      8/32/64, AIG construction with structural sharing and const-folding,
      Tseitin CNF encoding, and ordeal's own pure-Rust CDCL core as the primary
      engine on every target (CaDiCaL as optional cfg-gated native
      accelerator/benchmark only). SAT models decoded as counterexamples; the
      Z3 differential oracle wired for real in CI; out-of-scope constructs
      rejected with clear errors. Deliverable: ordeal decides the fragment and
      agrees with the Z3 oracle across a differential corpus.
    status: verified
    release: v0.2.0
    tags: [roadmap, p1, qf-bv, bit-blaster, cdcl, oracle]
    links:
      - type: derives-from
        target: SYS-001
      - type: derives-from
        target: SYS-004
      - type: satisfies
        target: TR-001
      - type: satisfies
        target: TR-002
      - type: satisfies
        target: TR-003
      - type: satisfies
        target: TR-004
      - type: satisfies
        target: TR-007
      - type: satisfies
        target: TR-010
    fields:
      req-type: functional
      priority: must
      verification-criteria: >
        Every operator agrees with Z3 at widths 8/32/64; SAT models re-evaluate
        to true; any ordeal-vs-oracle disagreement disables the op (reverts to
        Unknown) until its bit-blasting rule is fixed.

  - id: FEAT-002
    type: sw-req
    title: "P2 — LRAT emission + verified checker (Z3 demoted)"
    description: >
      The core deliverable — soundness by checking, not by trust: LRAT
      certificate emission from the SAT backend, a Rust LRAT checker as the
      sole trusted component, and the checker's soundness theorem discharged in
      Lean 4 via Aeneas translation (built with rules_lean). Certificate
      carries a checker-validated LRAT proof; SAT verdicts self-check their
      model. Milestone: every Unsat verdict is backed by a certificate the
      verified checker validated; Z3 is demoted to oracle and benchmark rival.
    status: verified
    release: v0.5.0
    tags: [roadmap, p2, lrat, checker, aeneas, lean, milestone]
    links:
      - type: derives-from
        target: SYS-002
      - type: derives-from
        target: SYS-003
      - type: satisfies
        target: TR-005
      - type: satisfies
        target: TR-006
      - type: satisfies
        target: TR-013
    fields:
      req-type: functional
      priority: must
      verification-criteria: >
        Verified checker accepts LRAT for all UNSAT corpus queries; soundness
        theorem discharged; an Unsat is never returned unless the verified
        checker accepted its LRAT proof.

  - id: FEAT-003
    type: sw-req
    title: "P3 — loom array/UF sliver + loom/synth integration"
    description: >
      Cover loom's remaining needs and put ordeal in the hot path: add
      non-extensional Array(BV32->BV8) memory via eager read-over-write
      (concrete consecutive offsets, no whole-array eq) and
      uninterpreted-function congruence via Ackermannization — both by
      preprocessing into the QF_BV core, no DPLL(T) — then integrate ordeal
      into loom (replacing its Z3 verification path) and synth
      (translation-validation queries).

      Ordeal-side deliverable (this repo, v0.7.0): the array/UF sliver
      (shipped v0.3.0) plus the integration surface that makes adoption
      possible — a portable, independently re-checkable UNSAT certificate
      (TR-017), a worked translation-validation example, and the consumer
      guide. Recon of the current consumers (origin/main, not stale local
      trees): synth-verify has ALREADY adopted ordeal as its default engine
      with Z3 demoted to an optional differential oracle (synth #553), so the
      v0.7.0 portable certificate is the primitive that lets its certifying
      validator independently re-check ordeal's UNSAT proofs (synth #667);
      loom still verifies its optimization rules directly with Z3 (its
      `verification` feature) and carries no certificate — a genuine adoption
      opportunity. Those cross-repo adoptions are owned by their teams and are
      tracked via field-report issues, not asserted here.
    status: implemented
    release: v0.7.0
    tags: [roadmap, p3, array, uf, loom, synth, integration]
    links:
      - type: derives-from
        target: SYS-007
      - type: derives-from
        target: SYS-006
      - type: satisfies
        target: TR-008
      - type: satisfies
        target: TR-017
    fields:
      req-type: functional
      priority: should
      verification-criteria: >
        Array/UF queries reduce to QF_BV and agree with Z3; out-of-sliver
        constructs rejected; the public consumer API + portable certificate +
        worked example are in place (VER-004, VER-016). Cross-repo adoption
        (loom/synth verifying against ordeal by default) is external and
        tracked via field-report issues — not part of this repo's verified set.

  - id: FEAT-004
    type: sw-req
    title: "P4 — drop Z3 from soundness; op-by-op bit-blaster proofs"
    description: >
      Retire Z3 from the soundness argument entirely: trust rests on the
      verified LRAT checker alone, and Z3 is retained only as an optional
      dev/CI differential oracle. The mechanism closing the encoder trust gap
      is op-by-op verification — each bit-blaster operator circuit is proved
      equivalent to the formal BitVec semantics. Milestone: the toolchain's
      soundness story no longer contains the words "trust Z3"; removing the
      oracle feature removes Z3 completely with no effect on correctness
      guarantees.
    status: implemented
    release: v0.6.0
    tags: [roadmap, p4, soundness, bit-blaster, formal-verification]
    links:
      - type: derives-from
        target: SYS-003
      - type: derives-from
        target: SYS-004
      - type: satisfies
        target: TR-003
    fields:
      req-type: functional
      priority: should
      verification-criteria: >
        Every operator circuit proved equisatisfiable with its BitVec
        semantics; removing the oracle feature removes Z3 with no effect on
        correctness guarantees.

  - id: FEAT-005
    type: sw-req
    title: "P5 — performance (hashing, rewrites, trimming, benchmarks)"
    description: >
      Optimize for CI-gating latency: AIG structural hashing, a curated
      Bitwuzla-subset of rewrites, LRAT trimming, incremental term-graph
      caching across a loom/synth pass, and benchmarking vs Z3. The honest win
      is amortized per-op integration latency, not out-solving Z3's SAT engine.

      Delivered in v0.8.0: the highest-value slice — commutative-operand
      canonicalization + constant-folding above the AIG (TR-018), which closes
      the concrete measured cliff (synth's A5: Ne(Mul(a,b),Mul(b,a)) @ 32, did
      not finish in 590 s → decides UNSAT instantly). AIG structural hashing
      already shipped (v0.2.0). DEFERRED to a follow-up (tracked as #57):
      LRAT-proof trimming, cross-pass incremental term-graph caching, and a
      full criterion benchmark harness vs Z3 — none are on the soundness path.
    status: implemented
    release: v0.8.0
    tags: [roadmap, p5, performance, benchmark]
    links:
      - type: derives-from
        target: SYS-005
      - type: satisfies
        target: TR-009
      - type: satisfies
        target: TR-018
    fields:
      req-type: performance
      priority: should
      verification-criteria: >
        Canonicalization closes the A5 cliff (UNSAT with a re-checkable
        certificate) and is semantics-preserving (VER-017). LRAT trimming,
        incremental caching, and the full benchmark suite are deferred and
        tracked separately — not claimed verified here.

  - id: FEAT-007
    type: sw-req
    title: "P6 — WASM trap/partiality semantics (shared trap-preservation library)"
    description: >
      Close the trap-elimination miscompile class (loom#273/#274/#278,
      synth#633/#666/#665/#642) at its root: a verifier that proves only VALUE
      equivalence over a total-op model cannot see a transformation that drops a
      trap. Ordeal ships a shared trap_condition library (TR-019) so both
      consumers verify TRAP-equivalence as a mandatory gate — loom (loom#279) and
      synth's translation_validator (VCR-VER-002).

      Phase A (v0.9.0): trap conditions for div/rem, unreachable, load/store OOB
      (symbolic mem_bound), and call_indirect (bounds/null-slot/type with a
      runtime-or-statically-discharged mode), the (value, may_trap) wrapper, and
      the full + trap-clause-only VC helpers. Pure QF_BV over the existing
      fragment — no new ops, no FP. Phase B (v0.9.1, TR-020): the float→int
      trunc trap classifier, proven against the real-float WASM predicate
      (exhaustive 2^32 for f32→i32; structured+ULP for the rest) incl. synth's
      #709 boundaries. Out of scope by design: FP-value arithmetic equivalence
      (QF_FP), which stays consumer-side differential.
    status: implemented
    release: v0.9.0
    tags: [roadmap, p6, trap, partiality, wasm, loom, synth, shared-checker]
    links:
      - type: derives-from
        target: SYS-007
      - type: derives-from
        target: SYS-006
      - type: satisfies
        target: TR-019
      - type: satisfies
        target: TR-020
    fields:
      req-type: functional
      priority: should
      verification-criteria: >
        Phase A trap_condition builders + VC helpers land, oracle-gated
        (VER-018): trap conditions match WASM semantics, dropped traps are caught
        with counterexamples, preserved lowerings prove re-checkable Unsat.
        Cross-repo adoption (loom#279, synth VCR-VER-002) is external. Phase B
        (trunc) and FP-value equivalence are tracked separately, not claimed here.
