      lean/DiffCheck.lean exits nonzero on any disagreement. Two real
      strictness divergences were found, triaged to spec ambiguity (both
      sides sound), and recorded in DiffCheck.lean's convention notes:
      (1) Lean core ignores declared addition-step ids and resolves hints
      positionally, so it accepts renumbered-id certificates ordeal
      rejects — handled by the documented sequential-id dialect gate,
      which still prints Lean core's raw verdict per file; (2) Lean core
      preloads original unit clauses into its assignment vector, so on a
      CNF with a contradictory unit pair it accepts hint-weakened steps
      ordeal rejects (encounteredBoth → derivedEmpty) — such CNFs are
      excluded as hint-weakening mutation sources by construction.
