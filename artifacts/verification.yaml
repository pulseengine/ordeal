  - id: VER-021
    type: sw-verification
    title: Symbolic-index select/store reduces soundly and matches Z3's array theory
    description: >
      Confirms TR-028. Read-over-write law under a SYMBOLIC BV32 index:
      select(store(a,i,v),i) = v is UNSAT to refute; with i != j the store is
      transparent (UNSAT to refute); and WITHOUT i != j the same equality stays
      SAT — so the encoding is not vacuous and does not silently assume
      non-aliasing. Array congruence (the soundness core) is checked by
      i = 5 => a[i] = a[5], and MUTATION-CHECKED: removing the array_congruence
      emission makes that test fail with the spurious model
      Sat([("$sel:a:#0",0), ("$sel:a:5",128), ("i",5)]), so the oracle is known
      to bite rather than merely pass. loom's own shape — a multi-byte
      little-endian chain over a symbolic base — round-trips. The concrete fast
      path is pinned: an all-constant query emits no Ite and no congruence
      clause. Every Unsat here runs the full certificate-checked pipeline.
      Independently, the Z3 differential draws concrete / symbolic /
      symbolic+offset indices and cross-checks against Z3's native array
      theory, which performs neither the read-over-write elimination nor the
      Ackermann congruence.
    status: verified
    release: v0.11.0
    tags: [array, symbolic-index, read-over-write, congruence, loom, differential]
    links:
      - type: verifies
        target: TR-028
      - type: verifies
        target: FEAT-013
    fields:
      method: automated-test
      steps:
        run: "cargo test -p ordeal --lib sliver:: solver::tests::symbolic_ solver::tests::loom_; cargo test -p ordeal --features oracle --lib sliver_diff"
        coverage: "Read-over-write law (alias/non-alias/undetermined), congruence, loom LE chain, concrete fast path, Z3 differential"
  - id: VER-022
    type: sw-verification
    title: Verus by(bit_vector) VC ingestion — gale's real obligations discharge
    description: >
      Confirms TR-023. Measured against the REAL toolchain, not a reproduction:
      verus 0.2026.02.15.61aa1bf (sha256 185ac063…, identical to the release
      rules_verus pins — the exact binary gale verifies with) ran a full
      verification of gale's crate (1159 verified, 0 errors) with --log-all,
      emitting 62 `by (bit_vector)` obligations. `ordeal verus` lifts each out
      of its log and discharges it: 62 discharged, 0 failed, every certificate
      re-checked by the trusted checker before the verdict is printed, spread
      across fault_decode.rs (17), work.rs (13), executor.rs (10),
      userspace.rs (7), event.rs (6), spinlock_validate.rs (4), atomic.rs (3),
      mpu.rs and cpu_mask.rs. The 53 non-bitvector queries in the same log are
      SKIPPED, not failed — only queries Verus itself marks
      `;; query spun off because: bitvector` are in the fragment.
      Two of gale's own obligations are pinned as fixtures (its cpu_mask.rs
      and the mpu.rs:98 `<==>` biconditional, the latter carrying 240 prelude
      quantifiers the slicer must exclude). Cross-check: gale's hand-encoded
      transcription of cpu_mask returns the same UNSAT (28210 vs 28250 bytes of
      LRAT), and gale's three *_mutant.smt2 discrimination files still return
      sat, so the pipeline is not vacuously proving everything.
    status: verified
    release: v0.12.0
    tags: [verus, smtlib, gale, asil-d, certificate, bridge]
    links:
      - type: verifies
        target: TR-023
      - type: verifies
        target: FEAT-009
    fields:
      method: automated-test
      steps:
        run: "cargo test -p ordeal --lib verus:: smtlib::; ordeal verus <verus --log-all dir> --cert-out <dir>"
        coverage: "Slicer boundary (prelude excluded, config dropped, location reported, non-BV refused), Bool consts, =>, boolean = (iff), real gale obligations end-to-end"
  - id: VER-023
