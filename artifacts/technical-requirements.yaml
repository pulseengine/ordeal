  - id: TR-013
    type: sw-req
    title: Verified LRAT checker via Aeneas-to-Lean translation
    description: >
      The formally-verified LRAT checker's soundness (accept implies UNSAT)
      shall be discharged by translating the Rust checker to Lean 4 via Aeneas
      and proving the theorem against the Aeneas-produced functional model,
      rather than by hand-transcribing the checker into a proof assistant. The
      Lean side is built and checked with lake/elan in CI (a rules_lean/Bazel
      path remains an option). Writing the checker directly in Lean (bv_decide
      style) is retained as a documented fallback. This refines
      how the verified-checker soundness obligation is met; the checker remains
      the sole trusted component with no link dependency on the solver core.
    status: verified
    release: v0.5.0
    tags: [lrat, checker, aeneas, lean, verified, trusted-core]
    links:
      - type: derives-from
        target: SYS-003
      - type: derives-from
        target: SYS-002
      - type: allocated-to
        target: ARC-006
    fields:
      req-type: functional
      priority: should
      verification-criteria: >
        The Rust checker translates via Aeneas to a Lean model whose soundness
        theorem (accept implies UNSAT) discharges in CI; the checker has no
        build/link dependency on the solver core.

  - id: TR-021
    type: sw-req
    title: 16-bit width coverage and byte-layout helpers
    description: >
      CORRECTION to this requirement's original premise ("support width 16"):
      the engine is already width-parametric — `eval::check_width` admits any
      width in 1..=128 and the blaster blasts per-bit — so width 16 was never
      unsupported, only unexercised (the validated matrix was 8/32/64). Ordeal
      shall therefore EXERCISE width 16 in the oracle matrix (blast-vs-evaluator
      and the derived div/rem family) so the consumers relying on it — relay's
      CCSDS/CRC-16, kiln's extend8/16_s — rest on tested ground rather than an
      untested capability.

      Ordeal shall additionally provide byte-layout helpers to_le_bytes /
      from_le_bytes as pure extract/concat compositions over the closed fragment
      (no new operations), so wire-codec round-trip and ABI-layout equivalence
      become one `prove_equiv` call for relay (#265), spar (#327) and kiln (#426).
    status: verified
    release: v0.10.0
    tags: [width-16, byte-layout, le-bytes, relay, spar, kiln]
    links:
      - type: derives-from
        target: SYS-001
      - type: allocated-to
        target: ARC-003
    fields:
      req-type: functional
      priority: should
      verification-criteria: >
        Width 16 is exercised by the blast-vs-evaluator matrix and the derived
        div/rem family against the SMT-LIB reference; to_le_bytes extracts each
        byte least-significant-first, from_le_bytes(to_le_bytes(x)) is proven
        equivalent to x with a re-checkable certificate, and a byte-swapped
        reassembly is caught as Sat (the oracle is not vacuous).

  - id: TR-022
    type: sw-req
    title: Multiplier-free div/rem family (native bvurem)
    description: >
      CORRECTION to this requirement's original premise ("today only bvudiv"):
      bvsdiv, bvsrem and bvurem ALREADY existed as DERIVED ops, lowered onto the
      closed core (crate::lowering, used by the SMT-LIB front-end), deliberately
      kept out of the fragment to keep the trusted term set minimal. The value
      capability was therefore never missing — the defect was COST: bvurem was
      `a - (a udiv b) * b` and bvsrem was `a - bvsdiv(a,b) * b`, so each
      instantiated a MULTIPLIER circuit.

      Removing that multiplier is only possible at the blast layer (the
      restoring-division circuit already produces the remainder; the term-level
      `a - q*b` identity cannot avoid the multiply). Ordeal shall therefore
      promote exactly ONE operation — bvurem — to the closed fragment, with a
      proven bit-blasting rule and a Kani harness (P4-style), and re-express
      bvsrem as a sign correction over it. bvsdiv stays derived (already
      multiplier-free). Net: the fragment grows by one op, and the whole div/rem
      family becomes multiplier-free.
    status: verified
    release: v0.10.0
    tags: [bvurem, bvsrem, bvsdiv, multiplier-free, kiln, closed-fragment]
    links:
      - type: derives-from
        target: SYS-001
      - type: allocated-to
        target: ARC-003
    fields:
      req-type: functional
      priority: should
      verification-criteria: >
        Native bvurem equals its SMT-LIB reference exhaustively at width 8
        (blast-vs-evaluator + Kani) and at 16/32/64; the derived bvurem/bvsdiv/
        bvsrem equal the SMT-LIB reference exhaustively at width 8 with NO Z3
        needed; no derivation instantiates a Mul node; no other verdict changes.

  - id: TR-023
    type: sw-req
    title: Verus-VC bridge over the SMT-LIB2 QF_BV front-end
    description: >
      A minimal SMT-LIB2 QF_BV reader already ships (v0.9.1, `ordeal check
      foo.smt2`) — validated end-to-end by the gale cpu_mask pilot (gale#173),
      which hand-encoded a real ASIL-D by(bit_vector) obligation and got a
      28 KB checker-validated LRAT certificate. The remaining work is the
      AUTOMATED bridge: ingest the exact VC dialect Verus emits to Z3 (let-
      bindings and the bitvector idioms Verus uses) and harden the reader to the
      full obligation set, plus a file/stream certificate-out path, so a Verus
      consumer re-discharges its obligations automatically with a re-checkable
      certificate instead of hand-encoding each — the CompCert-style argument for
      ASIL-D / DO-178C.
    status: draft
    release: v0.12.0
    tags: [smtlib, front-end, verus, gale, relay, certificate]
    links:
      - type: derives-from
        target: SYS-006
      - type: derives-from
        target: SYS-002
      - type: allocated-to
        target: ARC-001
    fields:
      req-type: interface
      priority: should
      verification-criteria: >
        Parses the QF_BV fragment; on gale's fault_decode/mpu obligations and
        relay's bitpack codecs, yields UNSAT with a cert the checker accepts;
        rejects out-of-fragment constructs with a clear error.

  - id: TR-024
    type: sw-req
    title: Equivalence and soundness verification toolkit
    description: >
      Ordeal shall expose a reusable prove_valid API (prove a QF_BV predicate
      valid, returning a re-checkable certificate on success) plus worked
      byte-layout prove_equiv recipes, covering the recurring consumer shapes:
