  - id: TR-013
    type: sw-req
    title: Verified LRAT checker via Aeneas-to-Lean translation
    description: >
      The formally-verified LRAT checker's soundness (accept implies UNSAT)
      shall be discharged by translating the Rust checker to Lean 4 via Aeneas
      and proving the theorem against the Aeneas-produced functional model,
      rather than by hand-transcribing the checker into a proof assistant. The
      Lean side is built and checked with lake/elan in CI (a rules_lean/Bazel
      path remains an option). Writing the checker directly in Lean (bv_decide
      style) is retained as a documented fallback. This refines
      how the verified-checker soundness obligation is met; the checker remains
      the sole trusted component with no link dependency on the solver core.
    status: verified
    release: v0.5.0
    tags: [lrat, checker, aeneas, lean, verified, trusted-core]
    links:
      - type: derives-from
        target: SYS-003
      - type: derives-from
        target: SYS-002
      - type: allocated-to
        target: ARC-006
    fields:
      req-type: functional
      priority: should
      verification-criteria: >
        The Rust checker translates via Aeneas to a Lean model whose soundness
        theorem (accept implies UNSAT) discharges in CI; the checker has no
        build/link dependency on the solver core.

  - id: TR-021
    type: sw-req
    title: 16-bit width coverage and byte-layout helpers
    description: >
      CORRECTION to this requirement's original premise ("support width 16"):
      the engine is already width-parametric — `eval::check_width` admits any
      width in 1..=128 and the blaster blasts per-bit — so width 16 was never
      unsupported, only unexercised (the validated matrix was 8/32/64). Ordeal
      shall therefore EXERCISE width 16 in the oracle matrix (blast-vs-evaluator
      and the derived div/rem family) so the consumers relying on it — relay's
      CCSDS/CRC-16, kiln's extend8/16_s — rest on tested ground rather than an
      untested capability.

      Ordeal shall additionally provide byte-layout helpers to_le_bytes /
      from_le_bytes as pure extract/concat compositions over the closed fragment
      (no new operations), so wire-codec round-trip and ABI-layout equivalence
      become one `prove_equiv` call for relay (#265), spar (#327) and kiln (#426).
    status: verified
    release: v0.10.0
    tags: [width-16, byte-layout, le-bytes, relay, spar, kiln]
    links:
      - type: derives-from
        target: SYS-001
      - type: allocated-to
        target: ARC-003
    fields:
      req-type: functional
      priority: should
      verification-criteria: >
        Width 16 is exercised by the blast-vs-evaluator matrix and the derived
        div/rem family against the SMT-LIB reference; to_le_bytes extracts each
        byte least-significant-first, from_le_bytes(to_le_bytes(x)) is proven
        equivalent to x with a re-checkable certificate, and a byte-swapped
        reassembly is caught as Sat (the oracle is not vacuous).

  - id: TR-022
    type: sw-req
    title: Multiplier-free div/rem family (native bvurem)
    description: >
      CORRECTION to this requirement's original premise ("today only bvudiv"):
      bvsdiv, bvsrem and bvurem ALREADY existed as DERIVED ops, lowered onto the
      closed core (crate::lowering, used by the SMT-LIB front-end), deliberately
      kept out of the fragment to keep the trusted term set minimal. The value
      capability was therefore never missing — the defect was COST: bvurem was
      `a - (a udiv b) * b` and bvsrem was `a - bvsdiv(a,b) * b`, so each
      instantiated a MULTIPLIER circuit.

      Removing that multiplier is only possible at the blast layer (the
      restoring-division circuit already produces the remainder; the term-level
      `a - q*b` identity cannot avoid the multiply). Ordeal shall therefore
      promote exactly ONE operation — bvurem — to the closed fragment, with a
      proven bit-blasting rule and a Kani harness (P4-style), and re-express
      bvsrem as a sign correction over it. bvsdiv stays derived (already
      multiplier-free). Net: the fragment grows by one op, and the whole div/rem
      family becomes multiplier-free.
    status: verified
    release: v0.10.0
    tags: [bvurem, bvsrem, bvsdiv, multiplier-free, kiln, closed-fragment]
    links:
      - type: derives-from
        target: SYS-001
      - type: allocated-to
        target: ARC-003
    fields:
      req-type: functional
      priority: should
      verification-criteria: >
        Native bvurem equals its SMT-LIB reference exhaustively at width 8
        (blast-vs-evaluator + Kani) and at 16/32/64; the derived bvurem/bvsdiv/
        bvsrem equal the SMT-LIB reference exhaustively at width 8 with NO Z3
        needed; no derivation instantiates a Mul node; no other verdict changes.

  - id: TR-023
    type: sw-req
    title: Verus-VC bridge over the SMT-LIB2 QF_BV front-end
    description: >
      A minimal SMT-LIB2 QF_BV reader already ships (v0.9.1, `ordeal check
      foo.smt2`) — validated end-to-end by the gale cpu_mask pilot (gale#173),
      which hand-encoded a real ASIL-D by(bit_vector) obligation and got a
      28 KB checker-validated LRAT certificate. The remaining work is the
      AUTOMATED bridge: ingest the exact VC dialect Verus emits to Z3 (let-
      bindings and the bitvector idioms Verus uses) and harden the reader to the
      full obligation set, plus a file/stream certificate-out path, so a Verus
      consumer re-discharges its obligations automatically with a re-checkable
      certificate instead of hand-encoding each — the CompCert-style argument for
      ASIL-D / DO-178C.
    status: verified
    release: v0.12.0
    tags: [smtlib, front-end, verus, gale, relay, certificate]
    links:
      - type: derives-from
        target: SYS-006
      - type: derives-from
        target: SYS-002
      - type: allocated-to
        target: ARC-001
    fields:
      req-type: interface
      priority: should
      verification-criteria: >
        Parses the QF_BV fragment; on gale's fault_decode/mpu obligations and
        relay's bitpack codecs, yields UNSAT with a cert the checker accepts;
        rejects out-of-fragment constructs with a clear error.

  - id: TR-024
    type: sw-req
    title: Equivalence and soundness verification toolkit
    description: >
      Ordeal shall expose a reusable prove_valid API (prove a QF_BV predicate
      valid, returning a re-checkable certificate on success) plus worked
      byte-layout prove_equiv recipes, covering the recurring consumer shapes:
      codec round-trip (relay), ABI-layout equivalence (spar), abstract-domain
      transfer soundness per concrete input (scry-bits), overflow rejection
      (sigil), and const-expr fold validation (meld).
    status: verified
    release: v0.13.0
    tags: [prove-valid, equivalence, soundness, relay, spar, scry, sigil, meld]
    links:
      - type: derives-from
        target: SYS-006
      - type: derives-from
        target: SYS-007
      - type: allocated-to
        target: ARC-001
    fields:
      req-type: functional
      priority: should
      verification-criteria: >
        prove_valid decides representative goals from each consumer with a
        re-checkable cert on UNSAT and a counterexample on SAT; recipes ship as
        runnable examples.

  - id: TR-025
    type: sw-req
    title: Certificate as evidence — rules_ordeal gate + stable bundle
    description: >
      Ordeal certificates shall be consumable as audit-grade evidence on the
      ordeal side: a hermetic rules_ordeal Bazel rule (paralleling
      rules_verus/rules_lean) to invoke ordeal as a build/CI verification
      gate, and a stable certificate serialization/bundle (ordeal-cert/v1)
      that re-checks offline, so a verified transform's UNSAT becomes a
      machine-re-checkable DO-178C / ISO-26262 / EU-AI-Act artifact. The
      consumer-side leg — rivet ingesting the bundle as an evidence artifact
      type — is split to TR-030 (v0.18.0), blocked on pulseengine/rivet#693
      landing against the pinned envelope (logged scope split, 2026-07-29).
    status: verified
    release: v0.17.0
    tags: [rules_ordeal, bazel, rivet, evidence, certificate, cross-cutting]
    links:
      - type: derives-from
        target: SYS-002
      - type: allocated-to
        target: ARC-006
    fields:
      req-type: functional
      priority: should
      verification-criteria: >
        rules_ordeal runs ordeal hermetically and fails on a non-UNSAT gate;
        a produced ordeal-cert/v1 bundle re-checks offline and rejects
        tampered proof or problem content before the checker runs.

  - id: TR-026
    type: sw-req
    title: Propositional-SAT front-end (certified feature-model consistency)
    description: >
      Ordeal shall expose its certified CNF+LRAT core below the bit-blaster as a
      propositional-SAT front-end, so a consumer (rivet feature-model / variant
      solve) can decide config validity / model consistency and emit a
      cert.recheck()-able artifact — the EU AI Act per-configuration trace ask.
    status: verified
    release: v0.14.0
    tags: [sat, propositional, rivet, feature-model, eu-ai-act, certificate]
    links:
      - type: derives-from
        target: SYS-002
      - type: allocated-to
        target: ARC-005
    fields:
      req-type: interface
      priority: should
      verification-criteria: >
        A feature-model SAT instance decides SAT/UNSAT; UNSAT carries a
        re-checkable LRAT certificate; matches rivet variant-solve semantics.

  - id: TR-027
    type: sw-req
    title: Lean-verified bit-blaster (encoder in the trusted core)
    description: >
      Ordeal shall extend the formally-verified trusted core from the checker to
      the ENCODER: prove in Lean 4 (via Aeneas, as with the checker) that each
      bit-blasting rule equals the formal BitVec semantics — replacing today's
      Kani-BOUNDED evidence with an unbounded proof, so the whole pipeline is
      formally trusted, not only the checker. Optionally add a re-checkable Sat
      witness for parity with the Unsat certificate.
    status: verified
    release: v0.15.0
    tags: [lean, aeneas, bit-blaster, trusted-core, assurance, sat-witness]
    links:
      - type: derives-from
        target: SYS-003
      - type: allocated-to
        target: ARC-003
    fields:
      req-type: functional
      priority: could
      verification-criteria: >
        Each blast rule's equality to BitVec semantics discharges in Lean with
        no sorry; the proof is CI-gated like the checker's.
  - id: TR-028
    type: sw-req
    title: Symbolic-index array select/store over Array(BV32 -> BV8)
    description: >
      Ordeal shall support select/store on Array(BV32 -> BV8) where the index is
      a SYMBOLIC BV32, via a sound symbolic read-over-write (index-equality case
      splits / Ackermann over the access set, or store-chain expansion), reduced
      into the existing closed QF_BV fragment and bit-blasted — no new solver
      theory and no new trusted operation. Sorts are fixed to BV32 -> BV8 to
      match loom exactly; whole-array (extensional) equality remains out of
      scope, as loom never asserts it. The number of distinct accesses per
      function is small and bounded, so eager instantiation is expected to be
      tractable; the concrete-index fast path is retained.
    status: verified
    release: v0.11.0
    tags: [array, symbolic-index, ackermannization, read-over-write, loom, sliver]
    links:
      - type: derives-from
        target: SYS-007
      - type: derives-from
        target: SYS-001
      - type: allocated-to
        target: ARC-002
    fields:
      req-type: functional
      priority: must
      verification-criteria: >
        Symbolic-index select/store reduces to QF_BV and matches the Z3
        differential over randomized store-chains and aliasing/non-aliasing
        index pairs; a read-over-write with a symbolic index no longer returns
        NonConcreteIndex/Unknown; Unsat certificates re-check.
  - id: TR-029
    type: sw-req
    title: Migration ergonomics — wall-clock deadline, sliver prove_equiv, eval-constant helper
    description: >
      Three small, non-fragment API asks from loom's validator migration
      (issue #71), none on the soundness path: (a) a wall-clock deadline on
      check (the consumer degrades a slow solve to a fast, safe revert;
      check_with_limit bounds CONFLICTS, which does not map to a millisecond
      budget) — deadline exhaustion must surface as Unknown, preserving the
      conservative contract; (b) prove_equiv over the SLIVER's extended terms
      (select/store/pure_call), mirroring Solver::prove_equiv for consumers
      whose operands live in the extended language; (c) an evaluate-to-constant
      helper for ground extended terms. All three keep the closed fragment
      closed — API surface only.
    status: verified
    release: v0.16.0
    tags: [ergonomics, api, deadline, sliver, loom, migration]
    links:
      - type: derives-from
        target: SYS-006
    fields:
      req-type: functional
      priority: should
      verification-criteria: >
        A deadline-bounded check returns Unknown (never a wrong verdict) when
        exhausted and the normal verdict otherwise; sliver prove_equiv agrees
        with lowering + core prove_equiv on shared queries; the constant helper
        agrees with the sliver evaluator. loom's migration checklist items (a)
        to (c) each demonstrable against a loom-shaped example.

  - id: TR-030
    type: sw-req
    title: rivet ingests ordeal-cert/v1 as an evidence artifact type
    description: >
      The consumer-side leg split from TR-025 (2026-07-29): rivet shall
      ingest an ordeal-cert/v1 bundle as a first-class evidence artifact
      type, so a checker-validated UNSAT certificate participates in the
      traceability graph like any other verification evidence. Was blocked
      on pulseengine/rivet#693; UNBLOCKED 2026-08-05 — rivet#693 Part 2
      (the ordeal-certificate artifact type, rivet PR #743) shipped in
      rivet v0.31.0/v0.32.0 with the recheck-gates-verifies rule, the
      v1 inline-only boundary, and the honest SAT warning. Ordeal's
      obligations (the stable format, TR-025, plus the ingestion
      demonstration) are discharged by the rivet_ingestion example and
      VER-029's released-binary run.
    status: verified
    release: v0.18.0
    tags: [rivet, evidence, certificate, cross-repo]
    links:
      - type: derives-from
        target: SYS-002
      - type: allocated-to
        target: ARC-006
    fields:
      req-type: functional
      priority: should
      verification-criteria: >
        A rivet build ingests a bundle produced by `ordeal verus --cert-out`
        (or the API), validates it as an artifact, and its recheck() passes;
        a tampered bundle is rejected at ingestion.

  - id: TR-031
    type: sw-req
    title: BMC-shaped workloads — measured practical-depth guidance
    description: >
      spar#350 proposes certificate-checked bounded model checking of
      concurrent AADL behaviour discharged through ordeal, and its spike's
      second acceptance measurement is "at what unrolling depth k does ordeal
      stop being practical on a realistic gale-sized model". Ordeal shall
      answer that with data it owns: a benchmark corpus of BMC-shaped QF_BV
      queries (bounded transition-relation unrollings over small-bit-vector
      state — thread states, queue counters, lock owners — in the shapes of
      spar#350's four canned properties), measured end-to-end certified
      (blast + solve + LRAT + verified check) on BOTH backends (own CDCL core
      and the cadical accelerator), with the practical-k envelope published
      in the consumer docs. One-shot-per-k stays deliberate (TR-002: no
      incremental API) — each depth re-solves and re-certifies, which is the
      certifying-algorithm story; the accelerator and TR-009's deferred
      caching are the levers if the envelope disappoints, and this corpus is
      exactly the measure-first workload that caching decision was waiting
      for.
    status: verified
    release: v0.18.0
    tags: [bmc, spar, benchmark, practical-k, cadical, consumer]
    links:
      - type: derives-from
        target: SYS-006
      - type: allocated-to
        target: ARC-005
    fields:
      req-type: functional
      priority: should
      verification-criteria: >
        The BMC corpus exists with at least deadlock- and queue-overflow-
        shaped instances; certified latency vs k is measured on both
        backends and published; the k where certified latency crosses 1s and
        10s is stated per shape; a seeded-defect instance (undersized queue)
        goes SAT with a decodable counterexample model.

  - id: TR-032
    type: sw-req
    title: Seed-portfolio parallel solve — parked until a measured wall
    description: >
      A native-only, cfg-gated seed portfolio for the own CDCL core (N lanes
      with different decision seeds / restart schedules racing on
      std::thread; first verdict wins; the winner's LRAT goes through the
      verified checker exactly as today). Deliberately PARKED: ordeal's
      measured bottlenecks are query-parallel at the consumer level
      (documented in docs/consuming-ordeal.md), a portfolio makes the
      winning certificate run-to-run nondeterministic (different proof
      bytes, different ordeal-cert/v1 hashes — an audit-reproducibility
      cost), and clause-sharing parallel CDCL is out of scope outright
      (proof emission from sharing solvers is a research problem).
      Activation condition, per the measure-first rule: a consumer reports
      a single-query latency wall that consumer-side fan-out, the cadical
      accelerator, and TR-009 caching do not clear — with the measurement.
      Wasm is never affected (threads unavailable; the own sequential core
      remains the only engine there, TR-004).
    status: draft
    release: v0.20.0
    tags: [parallel, portfolio, parked, measure-first, native-only]
    links:
      - type: derives-from
        target: SYS-004
      - type: allocated-to
        target: ARC-005
    fields:
      req-type: functional
      priority: could
      verification-criteria: >
        Only meaningful once activated: N-lane portfolio agrees with the
        sequential core on the differential corpus; every winning UNSAT
        proof is checker-accepted; wasm build unaffected; measured speedup
        on the activating consumer's workload is reported honestly,
        including the certificate-nondeterminism concession.

  - id: TR-033
    type: sw-req
    title: Release checksums are cosign-signed (keyless Sigstore, org Track A)
    description: >
      Field ask #116 (varve, 2026-08-08): the release workflow shall sign
      SHA256SUMS.txt with keyless cosign (GitHub OIDC / Fulcio / Rekor),
      publishing SHA256SUMS.txt.cosign.bundle plus detached .sig/.pem next
      to the sums — the org release-artifact standard's Track A, mirroring
      synth/rivet/witness. Without it, varve's fail-closed deposit workflow
      (which verifies sums against the repo's cosign identity, no TOFU)
      excludes ordeal from toolchain layers; v0.17.0 shipped unsigned and
      ordeal was dropped from layer 2026.08.1. The signing step ships with
      the v0.18.0 cut; verification necessarily runs against the first
      published signed release, so this artifact's verified milestone is
      v0.19.0 (the same pattern as any release-tail evidence).
    status: verified
    release: v0.19.0
    tags: [release, cosign, sigstore, supply-chain, varve, field-report]
    links:
      - type: derives-from
        target: SYS-005
    fields:
      req-type: non-functional
      priority: must
      verification-criteria: >
        The v0.18.0 GitHub Release carries SHA256SUMS.txt.cosign.bundle,
        .sig and .pem; `cosign verify-blob` passes against certificate
        identity https://github.com/pulseengine/ordeal/.github/workflows/
        release.yml@* and the GitHub Actions OIDC issuer on the downloaded
        sums; the sums still `shasum -c` the archives. Falsified if varve's
        deposit verification rejects the release.

  - id: TR-034
    type: sw-req
    title: Trusted Lean models are generated, never committed — drift unrepresentable
    description: >
      Issue #48, scoped 2026-08-12 (user decision: v0.19.0 = #48 then #47,
      design-doc gate first). Replace freshness CHECKING of the committed
      Aeneas-generated models (lean/Kernel.lean via the #44 drift guard;
      lean/BlastKernel.lean — found UNGUARDED during design) with
      GENERATION by construction: the models leave the tree, the required
      Lean CI job regenerates both from kernel.rs/blast_kernel.rs before
      proving, the Charon/Aeneas pins are single-sourced, and the drift
      workflow retires without the gate ever weakening. Full analysis,
      options (O1..O4), migration order, and open questions in
      docs/design/checker-single-sourcing.md — approved 2026-08-19 (O1;
      nix-once accepted; drift workflow retired via ordered swap; one-time
      recorded mutation demonstration).
    status: verified
    release: v0.19.0
    tags: [tcb, lean, aeneas, generation, drift, design-gated]
    links:
      - type: derives-from
        target: SYS-003
    fields:
      req-type: process
      priority: should
      verification-criteria: >
        The five criteria of docs/design/checker-single-sourcing.md section
        "Verification criteria (TR-034)": no committed generated models;
        required Lean job regenerates-then-proves green on warm and cold
        paths; mutation demonstration goes red for both kernels with no
        manual model step; drift workflow retired with the recorded
        branch-protection swap (gate never empty); pins defined exactly
        once.

  - id: TR-035
    type: sw-req
    title: Adversarial dual-mechanisation — independent Lean checker differenced against the Aeneas path
    description: >
      Issue #47, sequenced AFTER TR-034 (2026-08-12 decision): once the
      models are generated by construction, the faithfulness residual is
      exactly Charon/Aeneas translation at the pinned revisions. Stand up
      the bv_decide-style hand-written Lean LRAT checker on a shared
      certificate corpus and run it differentially against the
      Aeneas-path verdicts; any disagreement is a hard error (the
      ordeal-vs-Z3 differential pattern applied to the mechanisations
      themselves). Executed 2026-08-20: deterministic 48-pristine +
      16-mutated corpus, lake exe diffcheck over Lean core's verified
      LRAT.check, CI-gated in the lean job. The differential immediately
      earned its keep with two real spec-ambiguity findings (Lean core
      ignores declared addition-step ids and resolves hints positionally;
      its DefaultFormula.ofArray preloads original unit clauses, accepting
      hint-weakened steps ordeal rejects) — both divergences are sound on
      each side, documented in lean/DiffCheck.lean, and gated/visible in
      the adapter rather than papered over.
    status: verified
    release: v0.19.0
    tags: [tcb, lean, dual-mechanisation, differential, adversarial]
    links:
      - type: derives-from
        target: SYS-003
      - type: refines
        target: TR-034
    fields:
      req-type: process
      priority: could
      verification-criteria: >
        Both mechanisations run over the shared LRAT corpus (incl. the #29
        burn-in set) in CI with verdict agreement enforced; a seeded
        disagreement (mutated certificate accepted by one path) is
        demonstrated to fail the gate; any real disagreement found is
        triaged to translation gap vs spec ambiguity and recorded.

  - id: TR-036
