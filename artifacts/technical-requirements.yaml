      the survey named as the toolchain reference; the help banner keeps
      its honesty text (soundness property + outstanding obligation) and
      aligns on `Usage:`. The release workflow asserts the freshly built
      native binaries self-report exactly the tagged version (varve#38
      pattern), so a version/tag mismatch cannot ship.
    status: verified
    release: v0.19.0
    tags: [cli, baseline, version, evidence, field-report]
    links:
      - type: derives-from
        target: SYS-006
    fields:
      req-type: interface
      priority: should
      verification-criteria: >
        cli_baseline integration test: all three version spellings exit 0
        printing exactly `ordeal <semver>`; unknown flag exits 2 with
