      and incremental (push/pop) usage — with clear, actionable error messages,
      rather than silently mis-handling them.
    status: verified
    release: v0.2.0
    tags: [scope, errors, validation]
    links:
      - type: derives-from
        target: SYS-007
      - type: derives-from
        target: SYS-006
      - type: allocated-to
        target: ARC-001
    fields:
      req-type: constraint
      priority: must
      verification-criteria: >
        Each out-of-scope construct produces a distinct error; no out-of-scope
        construct reaches the solver core.

  - id: TR-011
    type: sw-req
    title: wasm32-wasip2 buildability with FFI-free backend split
    description: >
      Ordeal shall build as a wasm32-wasip2 target so it can run in-process
