        target: SYS-005
      - type: derives-from
        target: SYS-001
      - type: allocated-to
        target: ARC-008
      - type: allocated-to
        target: ARC-009
    fields:
      req-type: constraint
      priority: must
      verification-criteria: >
        `cargo build --target wasm32-wasip2 --release` succeeds on the default
