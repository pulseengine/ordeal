name: MC/DC (ordeal-lrat)

# Issue #279 / TR-077: a witness MC/DC truth table for the trusted checker's
# decisions, produced as release evidence, with a ratchet: a NEW uncovered
# decision (or a larger gap count in any checker source file) turns this job
# red. Confidence evidence only — no behaviour change. See docs/mcdc.md.
#
# Not a required context (a varve registry or layer outage must not block
# unrelated merges), same stance as the `varve-pin` job in ci.yml.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcdc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mcdc-ordeal-lrat:
    name: witness MC/DC ratchet (ordeal-lrat)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Pinned, not `stable`: the decision structure witness reads comes from
      # rustc's DWARF, so the baseline is only meaningful for the toolchain it
      # was measured with (mcdc/baseline.txt header). Bump both together.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: wasm32-wasip1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install varve (verified) and the pinned layer (witness)
        env:
          VARVE_VERSION: v0.38.0
        run: bash scripts/install_varve.sh
      - name: Row harness passes natively (each row returns its expected verdict)
        env:
          RUSTUP_TOOLCHAIN: "1.99.1"
        run: cargo test --manifest-path mcdc/ordeal-lrat/Cargo.toml --locked
      - name: MC/DC ratchet
        env:
          RUSTUP_TOOLCHAIN: "1.99.1"
        run: scripts/mcdc_gate.sh target/mcdc-ordeal-lrat
      - name: Upload the truth table
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mcdc-ordeal-lrat
          path: target/mcdc-ordeal-lrat
          if-no-files-found: error
