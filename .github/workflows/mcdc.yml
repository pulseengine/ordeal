name: MC/DC (ordeal-lrat)

# Issue #279 / TR-077: a witness MC/DC truth table for the trusted checker's
# decisions, produced as release evidence, with a ratchet: a NEW uncovered
# decision (or a larger gap count in any checker source file) turns this job
# red. Confidence evidence only — no behaviour change. See docs/mcdc.md.
#
# Not a required context (a varve registry or layer outage must not block
# unrelated merges), same stance as the `varve-pin` job in ci.yml.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcdc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mcdc-ordeal-lrat:
    name: witness MC/DC ratchet (ordeal-lrat)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Pinned, not `stable`: the decision structure witness reads comes from
      # rustc's DWARF, so the baseline is only meaningful for the toolchain it
      # was measured with (mcdc/baseline.txt header). Bump both together.
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master 2026-11-15 (#190); toolchain input required
        with:
          toolchain: 1.100.0
          targets: wasm32-wasip1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Install varve (verified) and the pinned layer (witness)
        env:
          VARVE_VERSION: v0.47.0
        run: bash scripts/install_varve.sh
      - name: Row harness passes natively (each row returns its expected verdict)
        env:
          RUSTUP_TOOLCHAIN: "1.100.0"
        run: cargo test --manifest-path mcdc/ordeal-lrat/Cargo.toml --locked
      # The baseline may only loosen for a stated cause: a changed witness
      # version in its header, or a new "# reason:" line (docs/mcdc.md).
      # The planted loosening (same witness, no reason) must be refused.
      - name: Baseline loosens only with a witness change or a reason (planted control)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git show FETCH_HEAD:mcdc/baseline.txt > "$RUNNER_TEMP/base-baseline.txt"
          bash scripts/check_mcdc_baseline_change.sh "$RUNNER_TEMP/base-baseline.txt" mcdc/baseline.txt
          f=$(awk '$1 ~ /^src\//{print $1; exit}' mcdc/baseline.txt)
          awk -v f="$f" '$1==f{$6=$6-1} {print}' mcdc/baseline.txt > "$RUNNER_TEMP/plant.txt"
          rc=0; bash scripts/check_mcdc_baseline_change.sh mcdc/baseline.txt "$RUNNER_TEMP/plant.txt" || rc=$?
          [ "$rc" = 1 ] || { echo "::error::planted loosening of $f was not refused (rc=$rc)"; exit 1; }
          echo "planted loosening of $f refused"
      - name: MC/DC ratchet
        env:
          RUSTUP_TOOLCHAIN: "1.100.0"
        run: scripts/mcdc_gate.sh target/mcdc-ordeal-lrat
      - name: Upload the truth table
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mcdc-ordeal-lrat
          path: target/mcdc-ordeal-lrat
          if-no-files-found: error
