# ── VEX re-issue (#146 / TR-043) ──────────────────────────────────────────
# Weekly, re-audit the LATEST release's shipped lockfile against the current
# RustSec database and compare what its published VEX says. Maintainer
# decisions (2026-09-24): latest release only; a changed answer OPENS AN
# ISSUE for a human to classify — this job never publishes a judgement on
# its own, and never writes `not_affected` (scripts/vex.py refuses to).
#
# Publishing a re-issue is a deliberate human step: after classifying the
# new match in vex/judgements.json on main, run this workflow by hand with
# publish=true.
#
# Integrity: the release-time `ordeal-<ver>.vex.json` is inside the
# cosign-signed SHA256SUMS.txt and is NEVER modified — overwriting it would
# break every consumer's `shasum -c`. A re-issue is a NEW asset
# `ordeal-<ver>.vex.r<N>.json` (N = CycloneDX document version) with its own
# keyless cosign bundle. Verify a re-issue with:
#   cosign verify-blob \
#     --certificate-identity-regexp \
#       'https://github.com/pulseengine/ordeal/.github/workflows/vex-reissue.yml@.*' \
#     --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
#     --bundle ordeal-<ver>.vex.r<N>.json.cosign.bundle ordeal-<ver>.vex.r<N>.json
name: VEX re-issue

on:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the re-issued VEX (after a human classified every new match)"
        type: boolean
        default: false
      tag:
        description: "Release tag (default: latest release)"
        required: false
        type: string

permissions:
  contents: write # upload a re-issued VEX (publish only)
  issues: write # open/update the classification issue
  id-token: write # keyless cosign for a re-issued VEX (publish only)

concurrency:
  group: vex-reissue
  cancel-in-progress: false

jobs:
  reissue:
    name: Re-audit the latest release's shipped lockfile
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      INPUT_TAG: ${{ inputs.tag }}
      PUBLISH: ${{ inputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve the release and its published VEX
        id: rel
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$(gh release view --json tagName -q .tagName)}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::not a release tag: '$TAG'"; exit 1
          fi
          BARE="${TAG#v}"
          ASSETS=$(gh release view "$TAG" --json assets -q '.assets[].name')
          if ! grep -qx "ordeal-${BARE}.cdx.json" <<<"$ASSETS"; then
            echo "::notice::$TAG predates SBOM/VEX publication (introduced in v0.20.0) — nothing to re-audit."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Newest statement for this release: the highest re-issue
          # revision, else the release-time document (revision 1).
          LATEST=$( (grep -E "^ordeal-${BARE}\.vex\.r[0-9]+\.json$" <<<"$ASSETS" || true) \
                    | sed -E 's/.*\.r([0-9]+)\.json$/\1 &/' | sort -n | tail -1 | cut -d' ' -f2)
          LATEST="${LATEST:-ordeal-${BARE}.vex.json}"
          REV=$(sed -nE 's/.*\.r([0-9]+)\.json$/\1/p' <<<"$LATEST"); REV="${REV:-1}"
          mkdir -p /tmp/vex
          gh release download "$TAG" -p "ordeal-${BARE}.cdx.json" -p "$LATEST" -D /tmp/vex
          # The generator and the human judgements come from main; the
          # lockfile comes from the tag (checked out below).
          cp scripts/vex.py /tmp/vex/vex.py
          git show origin/main:vex/judgements.json > /tmp/vex/judgements.json 2>/dev/null || echo '{}' > /tmp/vex/judgements.json
          {
            echo "skip=false"; echo "tag=$TAG"; echo "bare=$BARE"
            echo "latest=$LATEST"; echo "next=$((REV + 1))"
          } >> "$GITHUB_OUTPUT"

      - name: Check out the SHIPPED lockfile
        if: steps.rel.outputs.skip != 'true'
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: git checkout --quiet "$TAG"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.rel.outputs.skip != 'true'

      - uses: taiki-e/install-action@v2
        if: steps.rel.outputs.skip != 'true'
        with:
          tool: cargo-audit

      - name: Re-generate and compare
        id: cmp
        if: steps.rel.outputs.skip != 'true'
        env:
          BARE: ${{ steps.rel.outputs.bare }}
          LATEST: ${{ steps.rel.outputs.latest }}
          NEXT: ${{ steps.rel.outputs.next }}
        run: |
          set -euo pipefail
          python3 /tmp/vex/vex.py generate \
            --sbom "/tmp/vex/ordeal-${BARE}.cdx.json" \
            --out "/tmp/vex/fresh.json" \
            --judgements /tmp/vex/judgements.json \
            --version "$BARE" --doc-version "$NEXT" \
            --asserted-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if python3 /tmp/vex/vex.py compare "/tmp/vex/$LATEST" /tmp/vex/fresh.json > /tmp/vex/diff.txt; then
            cat /tmp/vex/diff.txt
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            cat /tmp/vex/diff.txt
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the classification issue
        if: steps.cmp.outputs.changed == 'true' && env.PUBLISH != 'true'
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          set -euo pipefail
          gh label create vex-reissue --color d93f0b \
            --description "A released ordeal's VEX answer changed; a human must classify" --force >/dev/null
          TITLE="VEX re-issue needed for ${TAG}"
          {
            echo "The weekly re-audit of **${TAG}**'s shipped lockfile against the current RustSec database no longer matches its published VEX."
            echo
            echo '```'
            cat /tmp/vex/diff.txt
            echo '```'
            echo
            echo "**To resolve** (a human judgement — this job never makes one):"
            echo "1. Classify each new \`in_triage\` advisory in \`vex/judgements.json\` on main (state, and for \`not_affected\` a CycloneDX justification plus a written detail, with \`classified-by\`). If suppressing it in CI, add the same id to \`deny.toml\` \`ignore\`."
            echo "2. Run the *VEX re-issue* workflow by hand with \`publish: true\` (and \`tag: ${TAG}\`)."
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > /tmp/vex/issue.md
          EXISTING=$(gh issue list --state open --label vex-reissue --search "in:title \"${TITLE}\"" --json number -q '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file /tmp/vex/issue.md
          else
            gh issue create --title "$TITLE" --label vex-reissue --body-file /tmp/vex/issue.md
          fi

      - name: Install cosign (publish only)
        if: steps.cmp.outputs.changed == 'true' && env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Publish the re-issued VEX (publish only)
        if: steps.cmp.outputs.changed == 'true' && env.PUBLISH == 'true'
        env:
          TAG: ${{ steps.rel.outputs.tag }}
          BARE: ${{ steps.rel.outputs.bare }}
          NEXT: ${{ steps.rel.outputs.next }}
        run: |
          set -euo pipefail
          OUT="/tmp/vex/ordeal-${BARE}.vex.r${NEXT}.json"
          cp /tmp/vex/fresh.json "$OUT"
          cosign sign-blob --yes --bundle "${OUT}.cosign.bundle" "$OUT"
          gh release upload "$TAG" "$OUT" "${OUT}.cosign.bundle"
          echo "::notice::published $(basename "$OUT") (+ cosign bundle); the signed release-time VEX is untouched"
