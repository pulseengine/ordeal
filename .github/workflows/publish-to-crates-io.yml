# Publishes the `ordeal` crate to crates.io on every `v*` tag push.
#
# Trust model: an org-wide CARGO_REGISTRY_TOKEN secret (set at the pulseengine
# GitHub organization, inherited by this repo). Cargo reads it directly from the
# CARGO_REGISTRY_TOKEN environment variable.
#
# Mirrors pulseengine/synth's publish-to-crates-io.yml, simplified for a
# single-crate workspace (no dependency-order walker needed).

name: Publish to crates.io

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag whose workspace state should be (re)published (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish ordeal
    if: github.repository == 'pulseengine/ordeal'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: publish-crates-io

      - name: Verify tag matches crate version
        env:
          # Untrusted-input safety: the tag name flows in via env: and is
          # dereferenced through $VERSION, never expanded into the shell.
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          EXPECTED="${VERSION#v}"
          ACTUAL=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; m=json.load(sys.stdin); print(next(p["version"] for p in m["packages"] if p["name"]=="ordeal"))')
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::tag $VERSION expects crate version $EXPECTED but Cargo.toml has $ACTUAL"
            exit 1
          fi
          echo "::notice::tag $VERSION matches crate version $ACTUAL"

      # Pre-flight fail-fast: package + verify-build the crate at the new
      # version before any upload. Catches broken metadata, missing README /
      # LICENSE, bad include/exclude, or code that doesn't compile.
      - name: Verify crate packages cleanly
        run: cargo package -p ordeal

      - name: Publish ordeal to crates.io
        run: cargo publish -p ordeal
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
