# Publishes the workspace crates to crates.io on every `v*` tag push.
#
# Trust model: an org-wide CARGO_REGISTRY_TOKEN secret (set at the pulseengine
# GitHub organization, inherited by this repo). Cargo reads it directly from the
# CARGO_REGISTRY_TOKEN environment variable.
#
# Mirrors pulseengine/synth's publish-to-crates-io.yml. Publish order matters:
# ordeal-lrat (the dependency-free checker) goes first; `cargo publish` blocks
# until the index has it, so the subsequent ordeal publish resolves it.

name: Publish to crates.io

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag whose workspace state should be (re)published (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish ordeal
    if: github.repository == 'pulseengine/ordeal'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: publish-crates-io

      - name: Verify tag matches crate version
        env:
          # Untrusted-input safety: the tag name flows in via env: and is
          # dereferenced through $VERSION, never expanded into the shell.
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          EXPECTED="${VERSION#v}"
          ACTUAL=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; m=json.load(sys.stdin); print(next(p["version"] for p in m["packages"] if p["name"]=="ordeal"))')
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::tag $VERSION expects crate version $EXPECTED but Cargo.toml has $ACTUAL"
            exit 1
          fi
          echo "::notice::tag $VERSION matches crate version $ACTUAL"

      # Pre-flight fail-fast for the dependency-free crate. ordeal itself
      # CANNOT be packaged before ordeal-lrat is on the index (its version
      # dep must resolve there), so its verify happens inside `cargo publish`
      # after the checker lands.
      - name: Verify ordeal-lrat packages cleanly
        run: cargo package -p ordeal-lrat

      # The checker first — it depends on nothing; ordeal depends on it.
      # `cargo publish` waits for index propagation before returning, so the
      # second publish (which packages + verify-builds ordeal against the
      # index) can resolve it.
      - name: Publish ordeal-lrat to crates.io
        run: cargo publish -p ordeal-lrat
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish ordeal to crates.io
        run: cargo publish -p ordeal
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
