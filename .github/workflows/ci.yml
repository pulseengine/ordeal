name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        # Default feature set only — the `oracle` feature pulls in Z3 (z3-sys),
        # which needs libz3 on the runner and is linted + tested by the
        # dedicated non-blocking `oracle` job below.
        run: cargo clippy --all-targets -- -D warnings

  build:
    name: Build (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        # Default build must NOT require Z3 — the Z3-backed `oracle` feature is
        # covered by the separate `oracle` job so the core gate stays hermetic.
        run: cargo test --all
      # #138: cert-bundle is pure-Rust and hermetic (serde/serde_json/sha2) —
      # it does NOT belong solely to the inert Z3 job. A cert_bundle
      # regression must block merge (the sha2-bump lesson, fully applied).
      - name: cert-bundle feature (clippy + tests, BLOCKING)
        run: |
          cargo clippy --all-targets --features cert-bundle -- -D warnings
          cargo test -p ordeal --features cert-bundle cert_bundle
      # #138: self-checking examples are executed, not just compiled — their
      # runtime assertions (tamper rejection, consumer recipes) rot silently
      # otherwise. dump_lrat_corpus runs in the lean job's differential.
      - name: Run the self-checking examples
        run: |
          set -euo pipefail
          cargo run -q -p ordeal --example translation_validation
          cargo run -q -p ordeal --example consumer_recipes
          cargo run -q -p ordeal --features cert-bundle --example rivet_ingestion -- "$(mktemp -d)" "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      # #138: benches are codegen-built (not run) so criterion-level rot is
      # caught; clippy alone only type-checks them.
      - name: Build benches (no run)
        run: cargo bench -p ordeal --no-run
      # #141/#138: every rivet verification citation must resolve against the
      # workspace and the real test inventory — a filter matching zero tests
      # is a vacuous-green citation (the VER-016/017 class).
      - name: Check rivet verification citations
        run: scripts/check_verification_citations.sh

  # ── Reproducible build (VER-003 / SYS-005) ────────────────────────────
  # Two release builds of the same commit in different target dirs must be
  # bit-identical, and the zero-dep default build must never pull externals
  # (cargo tree contains only the workspace crates; no build scripts, so no
  # C/C++ toolchain is ever invoked).
  repro:
    name: Reproducible build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Assert dependency-free default build
        run: |
          cargo tree -p ordeal --edges normal
          test "$(cargo tree -p ordeal --edges normal --prefix none | grep -vc '^\(ordeal\|ordeal-lrat\)')" -eq 0
      - name: Build twice, compare bit-for-bit
        run: |
          cargo build --release --target-dir target-a
          cargo build --release --target-dir target-b
          sha256sum target-a/release/ordeal target-b/release/ordeal
          cmp target-a/release/ordeal target-b/release/ordeal
      # #135: the host-default build above is not any artifact we ship.
      # Also certify the two configurations that ARE shipped/consumed:
      # the wasm component and a release-style `--target` build (the
      # release matrix's build path differs from a bare `cargo build`).
      - name: wasm32-wasip2 — build twice, compare bit-for-bit
        run: |
          rustup target add wasm32-wasip2
          cargo build --release --target wasm32-wasip2 --target-dir target-wa
          cargo build --release --target wasm32-wasip2 --target-dir target-wb
          cmp target-wa/wasm32-wasip2/release/ordeal.wasm target-wb/wasm32-wasip2/release/ordeal.wasm
      - name: release-style --target build — twice, compare bit-for-bit
        run: |
          cargo build --release --target x86_64-unknown-linux-gnu --target-dir target-ta
          cargo build --release --target x86_64-unknown-linux-gnu --target-dir target-tb
          cmp target-ta/x86_64-unknown-linux-gnu/release/ordeal target-tb/x86_64-unknown-linux-gnu/release/ordeal

  # ── wasm32-wasip2 buildability + native↔wasm differential (BLOCKING) ──
  # HARD REQUIREMENT: loom self-optimizes as a WebAssembly component and embeds
  # ordeal in-process, so ordeal MUST build as a wasm32-wasip2 component. The
  # default build is zero-external-deps and wasip2-clean; ordeal's own
  # pure-Rust CDCL core is the engine on every target, so no FFI ever reaches
  # the wasm path. This job is REQUIRED for merge.
  # #135 / TR-041 (relay-class): building the wasm artifact is not evidence it
  # BEHAVES like the native one — this job now also EXECUTES it under wasmtime
  # and demands byte-identical verdicts, models, certificates (full JSON incl.
  # LRAT text) and exit codes against the native binary on the committed
  # differential corpus. The required context therefore guards equivalence,
  # not just buildability.
  wasip2:
    name: Build (wasm32-wasip2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Add wasm32-wasip2 target
        run: rustup target add wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasip2
      - name: Build wasm32-wasip2 (release)
        run: cargo build --target wasm32-wasip2 --release
      - name: Build native (release) for the differential
        run: cargo build --release -p ordeal
      - name: Install wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: "27.0.0"
      - name: wasm ↔ native behavioral differential
        run: |
          scripts/wasm_native_differential.sh \
            target/release/ordeal \
            wasmtime run --dir . target/wasm32-wasip2/release/ordeal.wasm

  # ── musl build + SBOM smoke (#143/#144 de-risk) ───────────────────────
  # The release matrix's musl legs and the SBOM step only run at tag time;
  # this job proves both mechanisms on every PR so a breakage cannot first
  # surface during a release cut. The static musl binary is EXECUTED, not
  # just built (the #135 lesson): version assert + a certified-unsat solve.
  musl-sbom:
    name: musl build + SBOM smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl-sbom
      - name: Build x86_64-musl (release) and execute it
        run: |
          set -euo pipefail
          cargo build --release --target x86_64-unknown-linux-musl -p ordeal
          BIN=target/x86_64-unknown-linux-musl/release/ordeal
          file "$BIN" | grep -qi 'static' || { echo "::error::musl binary is not statically linked"; exit 1; }
          test "$("$BIN" --version)" = "ordeal $(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          printf '(set-logic QF_BV)\n(declare-const a (_ BitVec 8))\n(assert (distinct (bvurem a #x01) #x00))\n(check-sat)\n' | "$BIN" check - | head -1 | grep -qx unsat
      - name: SBOM generation smoke (cargo-cyclonedx)
        run: |
          set -euo pipefail
          cargo install --locked cargo-cyclonedx
          cargo cyclonedx --manifest-path crates/ordeal/Cargo.toml --format json --spec-version 1.5
          SBOM=$(find crates/ordeal -maxdepth 2 -name '*.cdx.json' | head -1)
          test -n "$SBOM" && test -f "$SBOM"
          python3 -c "import json,sys; d=json.load(open('$SBOM')); assert d['bomFormat']=='CycloneDX', d" \
            && echo "::notice::SBOM smoke OK: $SBOM"

  # ── cross aarch64-musl + qemu smoke (#135 de-risk for the release legs) ─
  # Proves the EXACT release recipe for the cross musl leg (cross build,
  # then qemu-user execution of the static binary) on every PR, so the
  # release-time qemu version assert cannot first fail at a tag cut.
  cross-qemu:
    name: cross aarch64-musl + qemu smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - uses: Swatinem/rust-cache@v2
        with:
          key: cross-aarch64-musl
      - name: Install qemu-user
        run: sudo apt-get update && sudo apt-get install -y qemu-user
      - name: cross build aarch64-musl (release) and execute under qemu
        run: |
          set -euo pipefail
          cross build --release --target aarch64-unknown-linux-musl -p ordeal
          BIN=target/aarch64-unknown-linux-musl/release/ordeal
          file "$BIN" | grep -qi 'static' || { echo "::error::aarch64 musl binary is not statically linked"; exit 1; }
          VER=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "$(qemu-aarch64 "$BIN" --version)" = "ordeal $VER"
          printf '(set-logic QF_BV)\n(declare-const a (_ BitVec 8))\n(assert (distinct (bvurem a #x01) #x00))\n(check-sat)\n' | qemu-aarch64 "$BIN" check - | head -1 | grep -qx unsat

  # ── Bazel build via rules_rust + rules_wasm_component (non-blocking) ──
  # Mirrors the org Bazel setup (see synth). Non-blocking (continue-on-error):
  # the module graph pulls rules_rust + the pulseengine rules_wasm_component
  # fork from the registry/git, and a registry/network hiccup must never block
  # the core cargo gate. The cargo `wasip2` job above is the enforced gate.
  bazel:
    name: Bazel build (optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Bazel build //...
        run: bazel build //... --config=dev
      # #136: a built-but-never-run test binary is the relay-class smell —
      # the Bazel-built tests must actually execute, not just link.
      - name: Bazel test //...
        run: bazel test //... --config=dev --test_output=errors

  # ── Lean model + soundness proof (VER-015) ────────────────────────────
  # Two obligations, both gated here:
  #   1. The Aeneas-generated model of the trusted checker (lean/Kernel.lean)
  #      elaborates.
  #   2. The hand-written soundness proof (lean/Sound.lean) elaborates
  #      fully — ZERO sorries. Issue #12 (`kernel_refines_pure`) is
  #      discharged, so `lrat_check_sound` is proved end to end; no proven
  #      leaf may silently regress to `sorry` and no new gap may appear.
  # This is a real gate (no continue-on-error): a broken proof or a widened
  # sorry budget fails CI.
  # TR-034 (issue #48): the models (Kernel.lean, BlastKernel.lean) are BUILD
  # PRODUCTS — this job regenerates them from the Rust sources (pinned
  # Charon/Aeneas via nix, lean/toolchain-pins.env) before every proof
  # build, so the proofs always certify the translation of the code that
  # ships; a stale committed model is unrepresentable (none is committed).
  # This absorbs and retires the #44 drift guard. The proof's trusted axioms
  # are ONLY propext / Classical.choice / Quot.sound (no sorryAx, no
  # native_decide) — GATED by lean/AxiomCheck.lean (#137): a default lake
  # target whose #guard_msgs-pinned `#print axioms` fails this job on any
  # new axiom in the soundness chain or a blaster capstone.
  lean:
    name: Lean model + soundness proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix (flakes)
        uses: DeterminateSystems/nix-installer-action@v23
      # Cache the /nix/store so the cold Charon(OCaml)+Aeneas build (~15+ min)
      # only happens when the pinned toolchain revisions change.
      # The key hashes the pins AND regen.sh: cache-nix-action skips saving
      # on an exact primary-key hit, so a mechanism change in regen.sh (like
      # the GC-roots fix) must mint a NEW key or the improved store never
      # gets saved and every run restores the stale snapshot (learned on
      # PR #126: its rooted store was never persisted under the old key).
      - name: Cache nix store (Charon/Aeneas)
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-charon-aeneas-${{ runner.os }}-${{ hashFiles('lean/toolchain-pins.env', 'lean/regen.sh') }}
          restore-prefixes-first-match: nix-charon-aeneas-${{ runner.os }}-
          gc-max-store-size-linux: 5G
      - name: Regenerate the Lean models from the Rust sources (timed)
        run: |
          start=$(date +%s)
          bash lean/regen.sh all
          echo "regen.sh all wall time: $(( $(date +%s) - start ))s"
          test -f lean/Kernel.lean && test -f lean/BlastKernel.lean
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v6
        with:
          path: |
            lean/.lake
            ~/.cache/mathlib
          key: lean-${{ hashFiles('lean/lake-manifest.json', 'lean/lean-toolchain') }}
      - name: Fetch mathlib cache and build the model
        working-directory: lean
        run: |
          lake exe cache get
          lake build Kernel
      - name: Build the soundness proof (elaborates, fully; zero sorries)
        working-directory: lean
        run: lake build Sound
      - name: Build the bit-blaster model + correctness proofs (issue #68)
        working-directory: lean
        # Plain `lake build` compiles every @[default_target] lib — the Aeneas-
        # generated BlastKernel and all Blaster* proof developments — so a rule
        # proof that regresses (or a regen that breaks a proof) fails CI here.
        run: lake build
      - name: Guard the sorry budget (all hand-written proofs, tree-derived scope)
        working-directory: lean
        run: |
          # #138: the scope is DERIVED from the tree, not a hand-typed list —
          # a renamed or newly added proof file cannot silently escape the
          # guard, and a shrunken inventory is itself a failure. Excluded:
          # the generated models (Kernel/BlastKernel — definitions only),
          # DiffCheck (an exe with its own differential gate), AxiomCheck
          # (fails the build directly via #guard_msgs), lakefile.
          # Counting uses LEAN'S OWN `declaration uses `sorry`` warnings via
          # re-elaboration (cache-independent, catches every sorry form), and
          # the elaborator's EXIT CODE is checked before any count is
          # trusted — a crashed elaboration is not a zero (#138).
          set -uo pipefail
          files=$(git ls-files . | grep '\.lean$' | grep -vE '(^|/)(Kernel|BlastKernel|DiffCheck|AxiomCheck)\.lean$' | grep -v lakefile || true)
          n=$(echo "$files" | grep -c . || true)
          if [ "$n" -lt 7 ]; then
            echo "::error::proof-file inventory has $n entries (< 7) — the guard's scope derivation broke or proofs were deleted"
            exit 1
          fi
          total=0
          for f in $files; do
            rc=0
            out=$(lake env lean "$f" 2>&1) || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::error file=lean/$f::elaboration failed (exit $rc) — a sorry count from a failed run is meaningless"
              echo "$out" | tail -5
              exit 1
            fi
            c=$(echo "$out" | grep -cE 'declaration uses .sorry.' || true)
            echo "sorry-bearing declarations in $f: $c"
            total=$((total + c))
          done
          if [ "$total" -ne 0 ]; then
            echo "::error::proofs must stay sorry-free; found $total sorry-bearing declaration(s)"
            exit 1
          fi
      - name: Guard lean/README.md against status drift (issue #53)
        working-directory: lean
        run: |
          # The soundness proof is complete and gated by the step above. The doc
          # must not drift back to describing it as open/unfinished, or a reader
          # (or an external reviewer) wrongly concludes the theorem is
          # undischarged — exactly the stale-doc regression of issue #53. One-way
          # binding: if the proof ever genuinely regressed, the sorry-budget step
          # above fails first, so this guard only bites when the proof IS complete
          # and the prose says otherwise.
          stale=$(grep -niE 'no proof yet|tracked and open|single tracked .?sorry|one tracked .?sorry|still open \(issue #12\)|until the theorem is discharged|kernel-model-drift|committed .?Kernel\.lean|does not re-run Aeneas|remaining P2 obligation' README.md || true)
          if [ -n "$stale" ]; then
            echo "$stale"
            echo "::error file=lean/README.md::lean/README.md describes the soundness proof as open, but it is discharged and gated above (see issue #53). Update the prose to match the proved state."
            exit 1
          fi
          echo "lean/README.md status wording is consistent with the proved, gated state."
      # ── TR-035 (issue #47): dual-mechanisation differential ─────────────
      # Cross-check ordeal's own verified checker against Lean core's
      # INDEPENDENTLY verified LRAT checker (Std.Tactic.BVDecide.LRAT.check,
      # the absorbed leansat checker) on a shared, deterministic certificate
      # corpus: every pristine pair must be accepted by both, every mutated
      # pair rejected by both. Any disagreement localizes an Aeneas
      # translation-faithfulness gap or a spec ambiguity and fails CI here.
      # This job has no Rust toolchain of its own (everything above is
      # nix/elan), so install one for the corpus dumper.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: diffcheck
      - name: Dump the shared LRAT certificate corpus (TR-035)
        run: cargo run -p ordeal --example dump_lrat_corpus -- /tmp/lrat-corpus
      - name: Differential — Lean core LRAT.check vs ordeal-lrat (TR-035)
        working-directory: lean
        run: lake exe diffcheck /tmp/lrat-corpus

  # ── Optional CaDiCaL accelerator backend (TR-004 / VER-008) ────────────
  # The off-by-default `cadical` feature builds CaDiCaL 2.1.3 hermetically
  # from the source vendored in the cadical-sys crate (no network, no system
  # solver), so unlike the Z3 job this one has no packaging fragility and is
  # a real gate: it proves the accelerator's UNSAT proofs pass the verified
  # LRAT checker and that it agrees with the own pure-Rust core.
  cadical:
    name: CaDiCaL backend (cadical feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: cadical
      - name: Clippy (cadical feature)
        run: |
          rustup component add clippy
          cargo clippy --all-targets --features cadical -- -D warnings
      - name: Run cadical backend tests
        run: cargo test -p ordeal --features cadical --release

  # ── Optional Z3 differential oracle (non-blocking) ────────────────────
  # `ordeal` is a self-contained QF_BV solver; the `oracle` cargo feature
  # cross-checks its answers against Z3. This job installs system Z3 and runs
  # the oracle tests, but is NOT required for merge (continue-on-error): a Z3
  # packaging hiccup on the runner must never block the core cargo gate.
  # With `cadical` enabled too it also runs the three-way VER-008 parity
  # (own core vs CaDiCaL vs Z3) in solver::cadical_parity_tests.
  oracle:
    name: Z3 Oracle (optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: oracle
      - name: Install Z3
        run: sudo apt-get update && sudo apt-get install -y z3 libz3-dev
      - name: Clippy (oracle feature)
        run: |
          rustup component add clippy
          cargo clippy --all-targets --features "oracle cadical cert-bundle" -- -D warnings
      # cert-bundle rides along so the cert_bundle test module and the
      # required-features examples (rivet_ingestion) compile and run in CI —
      # without it no job ever built them (caught 2026-08-08).
      - name: Run oracle tests (incl. three-way backend parity)
        run: cargo test --all --features "oracle cadical cert-bundle" --release
