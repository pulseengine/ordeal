# ── Kernel model drift guard (issue #44) ──────────────────────────────────
# The Lean soundness proof reasons about lean/Kernel.lean, the Aeneas-generated
# translation of crates/ordeal-lrat/src/kernel.rs. The `lean` CI job proves the
# theorem against the COMMITTED model but does not check the model is the
# CURRENT translation of the Rust. Without this guard, editing kernel.rs without
# re-running lean/regen.sh ships new Rust while the proof certifies a stale model
# — a green build that no longer describes the code that runs.
# See docs/formal-verification.md.
#
# REQUIRED-SAFE DESIGN: the job runs on EVERY PR/push (so it always reports a
# status and can be a required check), but only does the expensive nix/Charon/
# Aeneas work when the model, the Rust source, the regen script, or this workflow
# actually change (dorny/paths-filter). On unrelated PRs it passes in seconds; on
# relevant ones it regenerates (cached toolchain, ~2s warm) and diffs.
name: Kernel model drift

on:
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: kernel-drift-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  drift:
    name: Kernel.lean matches kernel.rs (regen.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Does this change touch the model / kernel / regen script / this workflow?
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            model:
              - 'crates/ordeal-lrat/src/kernel.rs'
              - 'lean/Kernel.lean'
              - 'lean/regen.sh'
              - '.github/workflows/kernel-model-drift.yml'

      - name: Not relevant — drift check trivially satisfied
        if: steps.filter.outputs.model != 'true'
        run: echo "No changes to kernel.rs / Kernel.lean / regen.sh — the committed model is unaffected. ✓"

      # Everything below runs only when the model could have drifted.
      - name: Install Nix (flakes)
        if: steps.filter.outputs.model == 'true'
        uses: DeterminateSystems/nix-installer-action@v22

      # Cache the /nix/store so the cold Charon(OCaml)+Aeneas build (~15+ min)
      # only happens when the pinned toolchain revisions in regen.sh change.
      - name: Cache nix store (Charon/Aeneas)
        if: steps.filter.outputs.model == 'true'
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-charon-aeneas-${{ runner.os }}-${{ hashFiles('lean/regen.sh') }}
          restore-prefixes-first-match: nix-charon-aeneas-${{ runner.os }}-
          gc-max-store-size-linux: 5G

      - name: Regenerate lean/Kernel.lean (timed)
        if: steps.filter.outputs.model == 'true'
        run: |
          start=$(date +%s)
          bash lean/regen.sh
          echo "regen.sh wall time: $(( $(date +%s) - start ))s"

      - name: Fail on model drift
        if: steps.filter.outputs.model == 'true'
        run: |
          if ! git diff --quiet -- lean/Kernel.lean; then
            echo "::error file=lean/Kernel.lean::lean/Kernel.lean is stale — NOT the current Aeneas translation of crates/ordeal-lrat/src/kernel.rs. Run \`lean/regen.sh\` locally and commit the result. The soundness proof must reason about the model that matches the shipped Rust."
            echo "----- diff (committed vs regenerated) -----"
            git --no-pager diff -- lean/Kernel.lean | head -200
            exit 1
          fi
          echo "lean/Kernel.lean is the current translation of kernel.rs. ✓"
