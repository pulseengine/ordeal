# ── Kani bit-blaster proofs (FEAT-004 / P4; tiers: TR-046 / #153) ─────────
# Machine-checked proofs that each bit-blasting rule equals the concrete
# reference (SMT-LIB QF_BV semantics) for ALL inputs — the Z3-independent
# soundness evidence for the blaster (crates/ordeal/src/blast/proofs.rs).
#
# Kani (CBMC/SAT) is expensive, so this does NOT run on every PR: it runs on a
# nightly schedule, on demand, and on PRs that touch the blaster. It is
# NON-BLOCKING (continue-on-error) — a proof regression is surfaced loudly but
# does not gate merges. The blaster soundness story rests on the REQUIRED
# Lean Blaster* proofs and the exhaustive-8 unit tests; this layer is the
# second, independent witness.
#
# Tiers (#153, 2026-09-24): the job had not completed since 2026-07-16 —
# urem_8 sat in the PR tier after v0.10.0 made the divider native and ran
# for hours until the runner was shut down, which also skipped the nightly
# tier behind it; 44 harnesses were in no tier at all. Now:
#   * the tiers are defined ONCE in scripts/kani_tiers.sh and consumed
#     here; `kani_tiers.sh check` (first job) fails unless every harness in
#     proofs.rs is in exactly one tier or explicitly unscheduled with a
#     reason — a harness nobody runs is not a proof;
#   * fast (PR + nightly): width-8 rules without mul/div — 1286 s on run
#     36019140498, the first completion since July;
#   * heavy (nightly): mul_8 (374 s), ONE JOB PER HARNESS with its own
#     timeout, so a runner preemption costs one harness, not the tier;
#   * wide (nightly, #169, #280): light 32/64 rules (list in the script), one job
#     per harness, run with a raised CBMC array field-sensitivity limit
#     (the reason and the measured times are in scripts/kani_tiers.sh);
#     the matrix is read from the script, so it cannot drift;
#   * everything else is explicitly unscheduled in the script WITH the
#     measured reason (the width-8 divider had the runner shut down under
#     it at ~50 min) — see #169.
# Job-level `continue-on-error` masks the run conclusion, so the final
# `verdict` job (#280) reads the job conclusions (gh api …/runs/<id>/jobs)
# and fails the run if any tier job did not succeed: three wide harnesses
# failed every nightly for five weeks behind a green badge before it.
name: Kani proofs

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 4 * * *" # nightly 04:00 UTC
  pull_request:
    branches: [main]
    paths:
      - "crates/ordeal/src/blast/**"
      # #192 phase 2: the harnesses target the proven rules directly.
      - "crates/ordeal/src/blast_kernel.rs"
      - "crates/ordeal-lrat/src/blast_kernel.rs"
      - "crates/ordeal/src/aig.rs"
      - "crates/ordeal/src/eval.rs"
      - "scripts/kani_tiers.sh"
      - ".github/workflows/kani.yml"

permissions:
  contents: read

concurrency:
  group: kani-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tiers:
    name: Harness coverage (every proof is in a tier)
    runs-on: [self-hosted, linux, x64, light]  # light job on our runners (hosted queue stalled, 2026-11-14)
    timeout-minutes: 5
    outputs:
      wide: ${{ steps.wide.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Every harness in proofs.rs is in exactly one tier (or unscheduled with a reason)
        run: bash scripts/kani_tiers.sh check
      - id: wide
        name: Wide-tier matrix (from the script)
        run: echo "matrix=$(bash scripts/kani_tiers.sh json wide)" >> "$GITHUB_OUTPUT"

  fast:
    name: Fast tier (width 8, no mul/div)
    needs: tiers
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: kani-fast
      - id: tier
        run: echo "args=$(bash scripts/kani_tiers.sh args fast)" >> "$GITHUB_OUTPUT"
      - name: Run Kani (fast tier)
        uses: model-checking/kani-github-action@69d357bade1eb7b32bc3fc3d5c3d173c5bfa5237 # v1
        with:
          # Pinned (#189 class): "latest" made the action query crates.io,
          # and a failed lookup failed a job (run 36821560393, and_32).
          kani-version: "0.68.0"
          args: ${{ steps.tier.outputs.args }}

  heavy:
    name: Heavy tier — ${{ matrix.harness }} (nightly)
    needs: tiers
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        harness: [mul_8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: kani-heavy
      - id: tier
        run: echo "args=$(bash scripts/kani_tiers.sh args heavy:${{ matrix.harness }})" >> "$GITHUB_OUTPUT"
      - name: Run Kani (${{ matrix.harness }})
        uses: model-checking/kani-github-action@69d357bade1eb7b32bc3fc3d5c3d173c5bfa5237 # v1
        with:
          # Pinned (#189 class): "latest" made the action query crates.io,
          # and a failed lookup failed a job (run 36821560393, and_32).
          kani-version: "0.68.0"
          args: ${{ steps.tier.outputs.args }}

  wide:
    name: Wide tier — ${{ matrix.harness }} (nightly)
    needs: tiers
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    # Local worst case add_64 1019 s (arm64); the cap leaves ~4x for the runner.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        harness: ${{ fromJSON(needs.tiers.outputs.wide) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: kani-wide
      - id: tier
        run: echo "args=$(bash scripts/kani_tiers.sh args wide:${{ matrix.harness }})" >> "$GITHUB_OUTPUT"
      - name: Run Kani (${{ matrix.harness }})
        uses: model-checking/kani-github-action@69d357bade1eb7b32bc3fc3d5c3d173c5bfa5237 # v1
        with:
          # Pinned (#189 class): "latest" made the action query crates.io,
          # and a failed lookup failed a job (run 36821560393, and_32).
          kani-version: "0.68.0"
          args: ${{ steps.tier.outputs.args }}

  # ── Verdict: the run conclusion tells the truth (#280) ─────────────────
  # Job-level continue-on-error keeps a proof regression from gating merges,
  # but it also made the run badge green while add_32, sub_32 and xor_64
  # failed on every nightly from 2026-10-02 to 2026-11-05. This job reads
  # the run's own job conclusions and fails if any tier job did not succeed,
  # so the nightly run goes red when a proof job does. It is not a required
  # check: merges are still not gated on Kani.
  # rivet: verifies VER-078
  verdict:
    name: Kani verdict (every tier job succeeded)
    needs: [tiers, fast, heavy, wide]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Read this run's tier job conclusions
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/actions/runs/$RUN/attempts/$ATTEMPT/jobs?per_page=100" \
            --jq '.jobs[] | select(.name | test("^(Harness coverage|Fast tier|Heavy tier|Wide tier)")) | "\(.conclusion)\t\(.name)"' > jobs.tsv
          cat jobs.tsv
          n=$(wc -l < jobs.tsv)
          test "$n" -ge 1 || { echo "::error::no tier jobs found in run $RUN"; exit 1; }
          bad=$(grep -cvE '^(success|skipped)'$'\t' jobs.tsv || true)
          if [ "$bad" != 0 ]; then
            grep -vE '^(success|skipped)'$'\t' jobs.tsv | while IFS=$'\t' read -r c name; do
              echo "::error::$name: $c"
            done
            exit 1
          fi
          echo "all $n tier jobs succeeded or were skipped"
