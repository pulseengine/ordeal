name: Release

# Release variant: serialize per-tag, never cancel. A cancelled release
# mid-publish leaves the GitHub Release page and per-target binary archives in
# an inconsistent state — better to queue than abort. Mirrors the
# pulseengine/synth release workflow.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "v*"
  # Manual re-run for a tag whose initial run failed partway. The tag must
  # already exist; this does not create tags.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Cross-platform binary builds ──────────────────────────────────────
  # The `ordeal` bin builds with the default feature set (no `oracle`/Z3):
  # z3-sys vendors and compiles Z3 from source, needs network + a large C++
  # build, and the solver is fully self-contained without it. Keeping it out
  # makes the release build fast and hermetic.
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-14
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          # musl legs (#143 / TR-039, varve realm portability): statically
          # linked, run on any Linux incl. Alpine and distroless-static.
          # Safe here: the default build is dependency-free pure Rust with
          # no dlopen/NSS use, and the CLI solve path is single-threaded,
          # so the musl allocator/static-linking caveats don't apply. The
          # x86_64 leg is NOT cross: the static binary executes on the
          # runner, so it also passes the tag-version assert below.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            cross: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build ordeal (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }} -p ordeal

      - name: Build ordeal (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} -p ordeal

      - name: Strip binary
        if: ${{ !matrix.cross }}
        run: strip "target/${{ matrix.target }}/release/ordeal" 2>/dev/null || true

      # The binary that ships must report the version being tagged (#120;
      # the varve#38 lesson — a v0.14.0 release once shipped a binary
      # reporting 0.13.1). #135 extended this: every executable leg also
      # SOLVES one query (a certified unsat), so no shipped artifact's
      # deepest exercised path is `--version`.
      - name: Assert tag version + solve smoke (native)
        if: ${{ !matrix.cross }}
        env:
          TARGET: ${{ matrix.target }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          BIN="target/${TARGET}/release/ordeal"
          GOT=$("$BIN" --version)
          WANT="ordeal ${VERSION#v}"
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::version mismatch: binary says '$GOT', tag demands '$WANT'"
            exit 1
          fi
          printf '(set-logic QF_BV)\n(declare-const a (_ BitVec 8))\n(assert (distinct (bvurem a #x01) #x00))\n(check-sat)\n' \
            | "$BIN" check - | head -1 | grep -qx unsat
          echo "::notice::'$GOT' matches the tag; certified-unsat smoke OK"

      # #135: the cross MUSL leg is static, so it executes under qemu-user —
      # same assert + smoke as the native legs (recipe proven per-PR by the
      # `cross aarch64-musl + qemu smoke` CI job). The cross GNU leg remains
      # unexecuted here by explicit disposition: a dynamic aarch64 glibc
      # binary needs an aarch64 loader+libc tree on this runner; its build
      # recipe is identical to the musl leg's modulo libc, and the musl
      # leg's execution covers the cross toolchain path.
      - name: Assert tag version + solve smoke (cross musl, qemu)
        if: ${{ matrix.cross && contains(matrix.target, 'musl') }}
        env:
          TARGET: ${{ matrix.target }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y qemu-user
          VERSION="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          BIN="target/${TARGET}/release/ordeal"
          GOT=$(qemu-aarch64 "$BIN" --version)
          WANT="ordeal ${VERSION#v}"
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::version mismatch: binary says '$GOT', tag demands '$WANT'"
            exit 1
          fi
          printf '(set-logic QF_BV)\n(declare-const a (_ BitVec 8))\n(assert (distinct (bvurem a #x01) #x00))\n(check-sat)\n' \
            | qemu-aarch64 "$BIN" check - | head -1 | grep -qx unsat
          echo "::notice::'$GOT' matches the tag under qemu; certified-unsat smoke OK"

      - name: Package archive
        env:
          TARGET: ${{ matrix.target }}
          # Resolve the version once: tag push -> refs/tags/vX.Y.Z;
          # workflow_dispatch -> the user-supplied tag input. Bound via env:
          # and dereferenced as $VERSION below — never expand ${{ ... }}
          # directly inside run: (command-injection vector).
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          ARCHIVE="ordeal-${VERSION}-${TARGET}.tar.gz"
          mkdir -p staging
          cp "target/${TARGET}/release/ordeal" staging/
          # #138: never silently ship archives without the license — the
          # old `|| true` swallowed a missing-file failure.
          cp README.md LICENSE staging/
          tar -czf "$ARCHIVE" -C staging .
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          retention-days: 7

  # ── Create the GitHub Release: checksums + provenance ─────────────────
  create-release:
    name: Create GitHub Release
    needs: [build-binaries]
    runs-on: ubuntu-latest
    permissions:
      # Release-asset upload needs contents: write; SLSA build-provenance
      # attestation needs id-token + attestations: write.
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          # Full history + tags: the rivet release note walks the commits
          # since the previous tag, and the tag annotation (the falsification
          # statement) is read back into the release body.
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f -name "*.tar.gz" -exec cp {} release-assets/ \;
          ls -la release-assets/

      # ── CycloneDX SBOM (#144 / TR-040) ─────────────────────────────────
      # Placed BEFORE the checksum step on purpose: the SBOM's digest lands
      # inside the cosign-signed SHA256SUMS.txt, so varve ingests it under
      # the same proof as the binaries (varve#179) with no new trust
      # machinery. Block mirrors pulseengine/synth's canonical release.yml.
      # (The cargo-package dirty-tree trap doesn't apply here — this
      # workflow never runs `cargo package` — but the SBOM is copied out of
      # the crate dir immediately regardless.)
      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx

      - name: Generate toolchain SBOM (CycloneDX)
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          BARE="${VERSION#v}"
          # cargo-cyclonedx doesn't proxy cargo's `-p` package-selection
          # flag (synth learned this on its first attempt); target the
          # crate's manifest directly. The output lands next to it.
          cargo cyclonedx \
            --manifest-path crates/ordeal/Cargo.toml \
            --format json \
            --spec-version 1.5
          SBOM_SRC="crates/ordeal/ordeal.cdx.json"
          if [ ! -f "$SBOM_SRC" ]; then
            SBOM_SRC=$(find crates/ordeal -maxdepth 2 -name '*.cdx.json' | head -1)
          fi
          test -n "$SBOM_SRC" && test -f "$SBOM_SRC"
          cp "$SBOM_SRC" "release-assets/ordeal-${BARE}.cdx.json"
          echo "::notice::SBOM written to release-assets/ordeal-${BARE}.cdx.json"
          ls -la release-assets/

      # ── CycloneDX VEX (#146 / TR-043) ───────────────────────────────────
      # Generated from THIS tag's checkout, so the audited Cargo.lock is the
      # shipped one (never main's). Scope = the shipped closure; bom-linked
      # to the SBOM above; records the advisory-db commit and assertion
      # time. Judgements come only from the human-authored
      # vex/judgements.json — `not_affected` is never generated. Placed
      # BEFORE the checksum step so its digest is cosign-signed with
      # everything else. Re-issues after release are handled by
      # vex-reissue.yml and never touch these signed sums.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Generate VEX (CycloneDX 1.5)
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          BARE="${VERSION#v}"
          python3 scripts/vex.py generate \
            --sbom "release-assets/ordeal-${BARE}.cdx.json" \
            --out "release-assets/ordeal-${BARE}.vex.json" \
            --version "$BARE" --doc-version 1 \
            --asserted-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Generate SHA256 checksums
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # ── Sigstore keyless signing (cosign) — issue #116 / TR-033 ────────
      # Signs SHA256SUMS.txt so a consumer can verify the checksum file
      # itself was produced by this workflow (closes the gap where an
      # attacker who can replace a release asset could also replace the
      # plain checksum file). Mirrors the org Track-A pattern (synth /
      # rivet / witness); varve's deposit workflow consumes exactly this,
      # fail-closed. The .cosign.bundle is the verifier-friendly artifact;
      # .sig + .pem are the detached signature and Fulcio certificate.
      # Verify with:
      #   cosign verify-blob \
      #     --certificate-identity-regexp \
      #       'https://github.com/pulseengine/ordeal/.github/workflows/release.yml@.*' \
      #     --certificate-oidc-issuer \
      #       'https://token.actions.githubusercontent.com' \
      #     --bundle SHA256SUMS.txt.cosign.bundle \
      #     SHA256SUMS.txt
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Sign SHA256SUMS with cosign (keyless OIDC)
        run: |
          set -euo pipefail
          cd release-assets
          cosign sign-blob \
            --yes \
            --bundle SHA256SUMS.txt.cosign.bundle \
            --output-signature SHA256SUMS.txt.sig \
            --output-certificate SHA256SUMS.txt.pem \
            SHA256SUMS.txt
          echo "::notice::SHA256SUMS signed via Sigstore keyless flow."
          ls -la ./*

      # ── SLSA build provenance (GitHub-native) ──────────────────────────
      # Generates an in-toto SLSA v1 provenance statement for every binary
      # archive, signed keyless via Sigstore and recorded in Rekor. Verify
      # with `gh attestation verify <file> --repo pulseengine/ordeal`.
      - name: Generate SLSA build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "release-assets/*.tar.gz"

      # ── Release note from the trace (rivet, ASPICE 11-03) ───────────────
      # The GitHub Release body is COMPOSED, never hand-typed: (1) the tag
      # annotation — the falsification statement the maintainer signed at
      # cut time; (2) `rivet release notes`, computed from the artifact
      # store and commit trailers, so the delivered scope, withheld scope,
      # and verification-evidence gaps cannot drift from the release-scope
      # query; (3) a pointer to CHANGELOG.md for prose. rivet itself is a
      # cosign-verified release download (its sums are keyless-signed by
      # rivet's own release workflow), never a floating install.
      - name: Install rivet from the pinned varve layer (varve.toml)
        # rivet comes from the layer pinned in varve.toml (realm pulseengine,
        # trust root in varve-realms.toml), verified by varve against the
        # realm root — not from a version string in this file. varve itself
        # is installed the verified way (cosign on its signed sums before
        # install.sh runs); see scripts/install_varve.sh. cosign was
        # installed above for the checksum signing.
        env:
          VARVE_VERSION: v0.38.0
        run: |
          bash scripts/install_varve.sh
          ~/.varve/bin/varve run rivet --version

      # rivet: verifies VER-047
      - name: Release gate — full V-closure and scope readiness (TR-047)
        # Nothing is published unless the V-model is closed at every ASPICE
        # level (schemas/ordeal-v-closure.yaml, severity error: `rivet
        # validate` exits non-zero on any open chain, in or out of the release
        # scope) AND the release scope itself is cuttable. Both are needed:
        # `rivet release status` is scope-only, so a broken chain on an
        # out-of-scope component would leave it green (VER-047's recorded
        # finding).
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          rivet validate
          rivet release status "$VERSION"

      - name: Compose the release body
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          PREV=$(git describe --tags --abbrev=0 "${VERSION}^" 2>/dev/null || true)
          {
            echo "## Falsification statement"
            echo
            # The annotated tag's message, minus its subject line.
            git tag -l --format='%(contents:body)' "$VERSION" | sed '/^$/N;/^\n$/D'
            echo
            echo "## Release note (rivet, from the trace)"
            echo
            if [ -n "$PREV" ]; then
              rivet release notes "$VERSION" --format markdown --since "$PREV" | sed '1{/^# /d;}'
            else
              rivet release notes "$VERSION" --format markdown | sed '1{/^# /d;}'
            fi
            echo
            echo "## Prose"
            echo
            echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${VERSION}/CHANGELOG.md) for the narrative of this release."
          } > /tmp/release-body.md
          echo "::group::release body"; cat /tmp/release-body.md; echo "::endgroup::"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Untrusted-input safety: the tag name flows in via env: and is
          # dereferenced through $VERSION, never expanded into the shell.
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          # Idempotent: re-running the workflow for an existing release
          # uploads/overwrites assets and refreshes the composed body.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::notice::Release $VERSION exists; uploading assets + refreshing the body"
            gh release upload "$VERSION" --clobber release-assets/*
            gh release edit "$VERSION" --notes-file /tmp/release-body.md
          else
            echo "::notice::Creating Release $VERSION with assets"
            gh release create "$VERSION" \
              --title "ordeal $VERSION" \
              --notes-file /tmp/release-body.md \
              release-assets/*
          fi
