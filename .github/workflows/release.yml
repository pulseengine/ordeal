name: Release

# Release variant: serialize per-tag, never cancel. A cancelled release
# mid-publish leaves the GitHub Release page and per-target binary archives in
# an inconsistent state — better to queue than abort. Mirrors the
# pulseengine/synth release workflow.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "v*"
  # Manual re-run for a tag whose initial run failed partway. The tag must
  # already exist; this does not create tags.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Release gate (#186, TR-047/TR-053) — runs FIRST ──────────────────
  # Nothing is built, signed, attested or published unless (1) the tagged
  # commit is on main, (2) that commit's own CI run on main concluded
  # `success`, and (3) the V-model is closed at every ASPICE level
  # (`rivet validate`, severity-error rules in schemas/ordeal-v-closure.yaml)
  # and the release scope is cuttable (`rivet release status`). Before #186
  # the rivet gate ran AFTER cosign signing and SLSA attestation, and the
  # crates.io publish was a separate workflow with no dependency on it:
  # v0.22.0 reached crates.io 15 minutes before its gate ran.
  gate:
    name: Release gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Tagged commit is on main with a successful CI run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          git fetch -q origin main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::tagged commit $SHA is not on main"
            exit 1
          fi
          CONCLUSION="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&branch=main&event=push" \
            --jq '[.workflow_runs[] | select(.status == "completed")][0].conclusion // "none"')"
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::CI on main for $SHA concluded '$CONCLUSION', not success"
            exit 1
          fi
          echo "::notice::$SHA is on main and its CI run concluded success"

      # install_varve.sh verifies varve's signed sums with cosign. The v0.23.0
      # tag run failed here (exit 127: cosign not found): before #186 moved
      # the gate into its own job, cosign had been installed earlier in the
      # same job for checksum signing.
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v2.4.1'

      - name: Install rivet from the pinned varve layer (varve.toml)
        env:
          VARVE_VERSION: v0.38.0
        run: |
          bash scripts/install_varve.sh
          ~/.varve/bin/varve run rivet --version

      # #203: the release's test evidence is the tagged commit's own main CI
      # run (its uploaded, measure-mapped JUnit), not a hand-written verdict.
      - name: Release gate — CI test results for the scope (TR-057)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          SHA="$(git rev-parse HEAD)"
          RUN="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&branch=main&event=push" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")][0].id')"
          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name rivet-test-results --dir ci-results
          python3 scripts/check_release_results.py "$VERSION" ci-results/rivet-test-results.xml
          rivet import-results --format junit ci-results/rivet-test-results.xml --output ci-results/rivet

      # rivet: verifies VER-047
      - name: Release gate — full V-closure and scope readiness (TR-047)
        # `rivet release status` is scope-only, so a broken chain on an
        # out-of-scope component would leave it green (VER-047's recorded
        # finding); `rivet validate` covers the whole graph.
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          rivet validate
          rivet release status "$VERSION"

  # ── Cross-platform binary builds ──────────────────────────────────────
  # The `ordeal` bin builds with the default feature set (no `oracle`/Z3):
  # z3-sys vendors and compiles Z3 from source, needs network + a large C++
  # build, and the solver is fully self-contained without it. Keeping it out
  # makes the release build fast and hermetic.
  build-binaries:
    name: Build ${{ matrix.target }}
    needs: [gate]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest  # macos-14 retired by GitHub 2026-11-05 (v0.36.0 run 42092397312); arm64, x86_64 binary smoke-runs under Rosetta as before
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          # musl legs (#143 / TR-039, varve realm portability): statically
          # linked, run on any Linux incl. Alpine and distroless-static.
          # Safe here: the default build is dependency-free pure Rust with
          # no dlopen/NSS use, and the CLI solve path is single-threaded,
          # so the musl allocator/static-linking caveats don't apply. The
          # x86_64 leg is NOT cross: the static binary executes on the
          # runner, so it also passes the tag-version assert below.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            cross: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        # #189: pinned rev — the same cross CI's aarch64-musl job tests.
        run: cargo install cross --git https://github.com/cross-rs/cross --rev 74e99b2223de06166f8cdcc1af7f1308ec52baf4 --locked

      - name: Build ordeal (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }} -p ordeal

      - name: Build ordeal (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} -p ordeal

      # TR-075 / #277: the standalone re-checker, built in its OWN cargo
      # invocation — building it together with ordeal would unify
      # ordeal-cert's `json` feature into the ordeal binary.
      - name: Build ordeal-recheck (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }} -p ordeal-recheck

      - name: Build ordeal-recheck (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} -p ordeal-recheck

      - name: Strip binary
        if: ${{ !matrix.cross }}
        run: |
          strip "target/${{ matrix.target }}/release/ordeal" 2>/dev/null || true
          strip "target/${{ matrix.target }}/release/ordeal-recheck" 2>/dev/null || true

      # The binary that ships must report the version being tagged (#120;
      # the varve#38 lesson — a v0.14.0 release once shipped a binary
      # reporting 0.13.1). #135 extended this: every executable leg also
      # SOLVES one query (a certified unsat), so no shipped artifact's
      # deepest exercised path is `--version`.
      - name: Assert tag version + solve smoke (native)
        if: ${{ !matrix.cross }}
        env:
          TARGET: ${{ matrix.target }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          BIN="target/${TARGET}/release/ordeal"
          GOT=$("$BIN" --version)
          WANT="ordeal ${VERSION#v}"
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::version mismatch: binary says '$GOT', tag demands '$WANT'"
            exit 1
          fi
          printf '(set-logic QF_BV)\n(declare-const a (_ BitVec 8))\n(assert (distinct (bvurem a #x01) #x00))\n(check-sat)\n' \
            | "$BIN" check - | head -1 | grep -qx unsat
          echo "::notice::'$GOT' matches the tag; certified-unsat smoke OK"
          # TR-075: ordeal-recheck reports the tag and re-checks the
          # committed real-solver bundles (v3 unsat + sat), so its deepest
          # exercised path is the trusted recheck, not `--version`.
          RBIN="target/${TARGET}/release/ordeal-recheck"
          RGOT=$("$RBIN" --version)
          if [ "$RGOT" != "ordeal-recheck ${VERSION#v}" ]; then
            echo "::error::version mismatch: ordeal-recheck says '$RGOT', tag demands 'ordeal-recheck ${VERSION#v}'"
            exit 1
          fi
          "$RBIN" crates/ordeal-recheck/tests/fixtures/v3-unsat-w3.json crates/ordeal-recheck/tests/fixtures/v3-sat-w5.json
          echo "::notice::'$RGOT' matches the tag; fixture recheck smoke OK"

      # #135: the cross MUSL leg is static, so it executes under qemu-user —
      # same assert + smoke as the native legs (recipe proven per-PR by the
      # `cross aarch64-musl + qemu smoke` CI job). The cross GNU leg remains
      # unexecuted here by explicit disposition: a dynamic aarch64 glibc
      # binary needs an aarch64 loader+libc tree on this runner; its build
      # recipe is identical to the musl leg's modulo libc, and the musl
      # leg's execution covers the cross toolchain path.
      - name: Assert tag version + solve smoke (cross musl, qemu)
        if: ${{ matrix.cross && contains(matrix.target, 'musl') }}
        env:
          TARGET: ${{ matrix.target }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y qemu-user
          VERSION="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          BIN="target/${TARGET}/release/ordeal"
          GOT=$(qemu-aarch64 "$BIN" --version)
          WANT="ordeal ${VERSION#v}"
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::version mismatch: binary says '$GOT', tag demands '$WANT'"
            exit 1
          fi
          printf '(set-logic QF_BV)\n(declare-const a (_ BitVec 8))\n(assert (distinct (bvurem a #x01) #x00))\n(check-sat)\n' \
            | qemu-aarch64 "$BIN" check - | head -1 | grep -qx unsat
          echo "::notice::'$GOT' matches the tag under qemu; certified-unsat smoke OK"
          RBIN="target/${TARGET}/release/ordeal-recheck"
          RGOT=$(qemu-aarch64 "$RBIN" --version)
          if [ "$RGOT" != "ordeal-recheck ${VERSION#v}" ]; then
            echo "::error::version mismatch: ordeal-recheck says '$RGOT', tag demands 'ordeal-recheck ${VERSION#v}'"
            exit 1
          fi
          qemu-aarch64 "$RBIN" crates/ordeal-recheck/tests/fixtures/v3-unsat-w3.json crates/ordeal-recheck/tests/fixtures/v3-sat-w5.json
          echo "::notice::'$RGOT' matches the tag under qemu; fixture recheck smoke OK"

      - name: Package archive
        env:
          TARGET: ${{ matrix.target }}
          # Resolve the version once: tag push -> refs/tags/vX.Y.Z;
          # workflow_dispatch -> the user-supplied tag input. Bound via env:
          # and dereferenced as $VERSION below — never expand ${{ ... }}
          # directly inside run: (command-injection vector).
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          ARCHIVE="ordeal-${VERSION}-${TARGET}.tar.gz"
          mkdir -p staging
          cp "target/${TARGET}/release/ordeal" staging/
          # #138: never silently ship archives without the license — the
          # old `|| true` swallowed a missing-file failure.
          cp README.md LICENSE staging/
          tar -czf "$ARCHIVE" -C staging .
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          # TR-075: the re-checker ships as its own archive (an auditor
          # downloads it without the solver).
          RECHECK_ARCHIVE="ordeal-recheck-${VERSION}-${TARGET}.tar.gz"
          mkdir -p staging-recheck
          cp "target/${TARGET}/release/ordeal-recheck" staging-recheck/
          cp README.md LICENSE staging-recheck/
          tar -czf "$RECHECK_ARCHIVE" -C staging-recheck .
          echo "RECHECK_ARCHIVE=$RECHECK_ARCHIVE" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: binary-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.RECHECK_ARCHIVE }}
          retention-days: 7

  # ── Create the GitHub Release: checksums + provenance ─────────────────
  # ── wasm32-wasip2 component (#189) ─────────────────────────────────────
  # Published inside the cosign-signed SHA256SUMS so consumers (loom, relay,
  # ...) can pin the exact component ordeal tested instead of rebuilding
  # their own. Built twice in separate target dirs and required to be
  # byte-identical, then the wasm↔native behavioral differential runs on the
  # EXACT bytes that are published.
  build-wasm:
    name: Build wasm32-wasip2 component
    needs: [gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Add wasm32-wasip2 target
        run: rustup target add wasm32-wasip2
      - name: Build twice, require identical bytes
        run: |
          set -euo pipefail
          cargo build --release -p ordeal --target wasm32-wasip2 --target-dir target/a
          cargo build --release -p ordeal --target wasm32-wasip2 --target-dir target/b
          a=$(sha256sum target/a/wasm32-wasip2/release/ordeal.wasm | cut -d' ' -f1)
          b=$(sha256sum target/b/wasm32-wasip2/release/ordeal.wasm | cut -d' ' -f1)
          echo "wasm sha256: $a / $b"
          test "$a" = "$b" || { echo "::error::wasm component is not reproducible"; exit 1; }
      # TR-075: the ordeal-recheck component, same discipline (its own cargo
      # invocation: no feature unification into ordeal.wasm).
      - name: Build ordeal-recheck twice, require identical bytes
        run: |
          set -euo pipefail
          cargo build --release -p ordeal-recheck --target wasm32-wasip2 --target-dir target/ra
          cargo build --release -p ordeal-recheck --target wasm32-wasip2 --target-dir target/rb
          a=$(sha256sum target/ra/wasm32-wasip2/release/ordeal-recheck.wasm | cut -d' ' -f1)
          b=$(sha256sum target/rb/wasm32-wasip2/release/ordeal-recheck.wasm | cut -d' ' -f1)
          echo "ordeal-recheck wasm sha256: $a / $b"
          test "$a" = "$b" || { echo "::error::ordeal-recheck wasm component is not reproducible"; exit 1; }
      - name: Build native (release) for the differential
        run: cargo build --release -p ordeal
      - name: Install wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: "27.0.0"
      - name: wasm ↔ native differential on the published bytes
        run: |
          scripts/wasm_native_differential.sh \
            target/release/ordeal \
            wasmtime run --dir . target/a/wasm32-wasip2/release/ordeal.wasm
      - name: ordeal-recheck component — tag version, recheck smoke, native differential
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          cargo build --release -p ordeal-recheck
          W="wasmtime run --dir . target/ra/wasm32-wasip2/release/ordeal-recheck.wasm"
          GOT=$($W --version)
          test "$GOT" = "ordeal-recheck ${VERSION#v}" || { echo "::error::ordeal-recheck component says '$GOT', tag demands 'ordeal-recheck ${VERSION#v}'"; exit 1; }
          F="crates/ordeal-recheck/tests/fixtures/v3-unsat-w3.json crates/ordeal-recheck/tests/fixtures/v3-sat-w5.json"
          $W --format json $F > recheck-wasm.json
          target/release/ordeal-recheck --format json $F > recheck-native.json
          cmp recheck-wasm.json recheck-native.json
      - name: Stage the component
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          mkdir -p wasm-out
          cp target/a/wasm32-wasip2/release/ordeal.wasm "wasm-out/ordeal-${VERSION}-wasm32-wasip2.wasm"
          cp target/ra/wasm32-wasip2/release/ordeal-recheck.wasm "wasm-out/ordeal-recheck-${VERSION}-wasm32-wasip2.wasm"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wasm-component
          path: wasm-out/*.wasm

  create-release:
    name: Create GitHub Release
    needs: [build-binaries, build-wasm]
    runs-on: ubuntu-latest
    permissions:
      # Release-asset upload needs contents: write; SLSA build-provenance
      # attestation needs id-token + attestations: write.
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          # Full history + tags: the rivet release note walks the commits
          # since the previous tag, and the tag annotation (the falsification
          # statement) is read back into the release body.
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts

      - name: Flatten release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f -name "*.tar.gz" -exec cp {} release-assets/ \;
          find artifacts -type f -name "*.wasm" -exec cp {} release-assets/ \;
          ls -la release-assets/

      # ── CycloneDX SBOM (#144 / TR-040) ─────────────────────────────────
      # Placed BEFORE the checksum step on purpose: the SBOM's digest lands
      # inside the cosign-signed SHA256SUMS.txt, so varve ingests it under
      # the same proof as the binaries (varve#179) with no new trust
      # machinery. Block mirrors pulseengine/synth's canonical release.yml.
      # (The cargo-package dirty-tree trap doesn't apply here — this
      # workflow never runs `cargo package` — but the SBOM is copied out of
      # the crate dir immediately regardless.)
      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx --version 0.5.9

      - name: Generate toolchain SBOM (CycloneDX)
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          BARE="${VERSION#v}"
          # cargo-cyclonedx doesn't proxy cargo's `-p` package-selection
          # flag (synth learned this on its first attempt); target the
          # crate's manifest directly. The output lands next to it.
          cargo cyclonedx \
            --manifest-path crates/ordeal/Cargo.toml \
            --format json \
            --spec-version 1.5
          SBOM_SRC="crates/ordeal/ordeal.cdx.json"
          if [ ! -f "$SBOM_SRC" ]; then
            SBOM_SRC=$(find crates/ordeal -maxdepth 2 -name '*.cdx.json' | head -1)
          fi
          test -n "$SBOM_SRC" && test -f "$SBOM_SRC"
          cp "$SBOM_SRC" "release-assets/ordeal-${BARE}.cdx.json"
          echo "::notice::SBOM written to release-assets/ordeal-${BARE}.cdx.json"
          ls -la release-assets/

      # ── CycloneDX VEX (#146 / TR-043) ───────────────────────────────────
      # Generated from THIS tag's checkout, so the audited Cargo.lock is the
      # shipped one (never main's). Scope = the shipped closure; bom-linked
      # to the SBOM above; records the advisory-db commit and assertion
      # time. Judgements come only from the human-authored
      # vex/judgements.json — `not_affected` is never generated. Placed
      # BEFORE the checksum step so its digest is cosign-signed with
      # everything else. Re-issues after release are handled by
      # vex-reissue.yml and never touch these signed sums.
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-audit@0.22.2

      - name: Generate VEX (CycloneDX 1.5)
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          BARE="${VERSION#v}"
          python3 scripts/vex.py generate \
            --sbom "release-assets/ordeal-${BARE}.cdx.json" \
            --out "release-assets/ordeal-${BARE}.vex.json" \
            --version "$BARE" --doc-version 1 \
            --asserted-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      # ── Tools from the pinned varve layer: rivet + wsc (#278 / TR-076) ──
      # varve is installed the verified way (cosign on its signed sums
      # before install.sh runs; see scripts/install_varve.sh), so cosign is
      # installed first. rivet (release body, below) and wsc (wasm signing,
      # next) both come from the layer pinned in varve.toml, verified
      # against the realm root, never from a version string in this file.
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v2.4.1'

      - name: Install the pinned varve layer (rivet, wsc)
        env:
          VARVE_VERSION: v0.38.0
        run: |
          bash scripts/install_varve.sh
          ~/.varve/bin/varve run rivet --version
          ~/.varve/bin/varve run wsc --version

      # ── wsc keyless signatures on the wasm components (#278 / TR-076) ──
      # Each reproducible component X.wasm is published unchanged (its bytes
      # are the ones the reproducibility and wasm<->native gates ran on) and
      # next to it X.signed.wasm: the same module with a sigil signature
      # section embedded by `wsc sign --keyless` (ephemeral key, Fulcio
      # certificate for this workflow's OIDC identity, Rekor entry). Placed
      # BEFORE the checksum step so the signed files are in the cosign-signed
      # sums and the SLSA provenance too. Two self-checks fail the release:
      # `wsc verify` must accept each signed file for exactly this workflow
      # ref, and `wsc detach` must give back the published bytes, so the
      # signature covers the reproducible module and nothing else.
      #   wsc verify --keyless -i ordeal-vX.Y.Z-wasm32-wasip2.signed.wasm \
      #     --cert-identity https://github.com/pulseengine/ordeal/.github/workflows/release.yml@refs/tags/vX.Y.Z \
      #     --cert-oidc-issuer https://token.actions.githubusercontent.com
      # rivet: verifies VER-076
      - name: Sign the wasm components with wsc (keyless)
        run: |
          set -euo pipefail
          ID="https://github.com/${GITHUB_WORKFLOW_REF}"
          ISS="https://token.actions.githubusercontent.com"
          WSC=$(~/.varve/bin/varve which wsc | head -1)
          n=0
          for w in release-assets/*-wasm32-wasip2.wasm; do
            s="${w%.wasm}.signed.wasm"
            "$WSC" sign --keyless --expected-issuer "$ISS" -i "$w" -o "$s" >/dev/null
            "$WSC" verify --keyless --cert-identity "$ID" --cert-oidc-issuer "$ISS" -i "$s"
            "$WSC" detach -i "$s" -o "$s.detached" -S "$s.sig" >/dev/null
            cmp "$w" "$s.detached"
            rm -f "$s.detached" "$s.sig"
            echo "::notice::wsc keyless-signed $(basename "$s") for $ID"
            n=$((n+1))
          done
          test "$n" = 2 || { echo "::error::expected 2 wasm components to sign, signed $n"; exit 1; }
          ls -la release-assets/

      - name: Generate SHA256 checksums
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # ── Sigstore keyless signing (cosign) — issue #116 / TR-033 ────────
      # Signs SHA256SUMS.txt so a consumer can verify the checksum file
      # itself was produced by this workflow (closes the gap where an
      # attacker who can replace a release asset could also replace the
      # plain checksum file). Mirrors the org Track-A pattern (synth /
      # rivet / witness); varve's deposit workflow consumes exactly this,
      # fail-closed. The .cosign.bundle is the verifier-friendly artifact;
      # .sig + .pem are the detached signature and Fulcio certificate.
      # Verify with:
      #   cosign verify-blob \
      #     --certificate-identity-regexp \
      #       'https://github.com/pulseengine/ordeal/.github/workflows/release.yml@.*' \
      #     --certificate-oidc-issuer \
      #       'https://token.actions.githubusercontent.com' \
      #     --bundle SHA256SUMS.txt.cosign.bundle \
      #     SHA256SUMS.txt
      - name: Sign SHA256SUMS with cosign (keyless OIDC)
        run: |
          set -euo pipefail
          cd release-assets
          cosign sign-blob \
            --yes \
            --bundle SHA256SUMS.txt.cosign.bundle \
            --output-signature SHA256SUMS.txt.sig \
            --output-certificate SHA256SUMS.txt.pem \
            SHA256SUMS.txt
          echo "::notice::SHA256SUMS signed via Sigstore keyless flow."
          ls -la ./*

      # ── SLSA build provenance (GitHub-native) ──────────────────────────
      # Generates an in-toto SLSA v1 provenance statement for every binary
      # archive, signed keyless via Sigstore and recorded in Rekor. Verify
      # with `gh attestation verify <file> --repo pulseengine/ordeal`.
      - name: Generate SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            release-assets/*.tar.gz
            release-assets/*.wasm

      # ── Release note from the trace (rivet, ASPICE 11-03) ───────────────
      # The GitHub Release body is COMPOSED, never hand-typed: (1) the tag
      # annotation — the falsification statement the maintainer signed at
      # cut time; (2) `rivet release notes`, computed from the artifact
      # store and commit trailers, so the delivered scope, withheld scope,
      # and verification-evidence gaps cannot drift from the release-scope
      # query; (3) a pointer to CHANGELOG.md for prose. rivet comes from
      # the pinned varve layer installed above, never a floating install.
      - name: Compose the release body
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          PREV=$(git describe --tags --abbrev=0 "${VERSION}^" 2>/dev/null || true)
          {
            echo "## Falsification statement"
            echo
            # The annotated tag's message, minus its subject line.
            git tag -l --format='%(contents:body)' "$VERSION" | sed '/^$/N;/^\n$/D'
            echo
            echo "## Release note (rivet, from the trace)"
            echo
            if [ -n "$PREV" ]; then
              rivet release notes "$VERSION" --format markdown --since "$PREV" | sed '1{/^# /d;}'
            else
              rivet release notes "$VERSION" --format markdown | sed '1{/^# /d;}'
            fi
            echo
            echo "## Prose"
            echo
            echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${VERSION}/CHANGELOG.md) for the narrative of this release."
          } > /tmp/release-body.md
          echo "::group::release body"; cat /tmp/release-body.md; echo "::endgroup::"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Untrusted-input safety: the tag name flows in via env: and is
          # dereferenced through $VERSION, never expanded into the shell.
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          # Idempotent: re-running the workflow for an existing release
          # uploads/overwrites assets and refreshes the composed body.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::notice::Release $VERSION exists; uploading assets + refreshing the body"
            gh release upload "$VERSION" --clobber release-assets/*
            gh release edit "$VERSION" --notes-file /tmp/release-body.md
          else
            echo "::notice::Creating Release $VERSION with assets"
            gh release create "$VERSION" \
              --title "ordeal $VERSION" \
              --notes-file /tmp/release-body.md \
              release-assets/*
          fi

  # ── crates.io publish (#186) — only after the gated GitHub Release ────
  # Formerly publish-to-crates-io.yml, triggered by the same tag push with
  # no dependency on this workflow. A crates.io upload cannot be undone, so
  # it now runs last, behind the gate and the Release.
  publish-crates-io:
    name: Publish to crates.io
    needs: [create-release]
    if: github.repository == 'pulseengine/ordeal'
    uses: ./.github/workflows/publish-to-crates-io.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit
