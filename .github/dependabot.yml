version: 2
# Groups live inside the `updates` entry they apply to: a top-level `groups:`
# key is not part of the dependabot schema, and a group only ever sees the
# ecosystem of its own entry. Group patterns are globs, not regexes.
#
# One PR per weekly round of github-actions pins (they used to arrive one PR
# per action). The cargo workspaces are `/` and the separate `fuzz/`
# workspace; `crates/ordeal` is a member of `/`, not a root of its own, so an
# entry for it fails every run ("not the workspace root").
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      github-actions-all:
        patterns:
          - "*"
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    labels:
      - dependencies
